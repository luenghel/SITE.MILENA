<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunidad · Milena Machado</title>
<link rel="stylesheet" href="styles.css">
<style>
  .page-hero{padding:40px 32px 24px;text-align:center;position:relative;overflow:hidden}
  .page-hero-glow-1{position:absolute;width:400px;height:400px;left:-100px;top:-100px;border-radius:50%;background:radial-gradient(circle,rgba(232,184,196,0.25),transparent 65%);pointer-events:none}
  .page-hero-glow-2{position:absolute;width:340px;height:340px;right:-80px;top:-60px;border-radius:50%;background:radial-gradient(circle,rgba(212,163,86,0.22),transparent 70%);pointer-events:none}
  .page-hero-content{position:relative;max-width:680px;margin:0 auto}
  .page-badge{display:inline-block;padding:6px 14px;background:rgba(212,163,86,0.12);border:0.5px solid rgba(212,163,86,0.4);border-radius:20px;font-size:11.5px;letter-spacing:0.2em;color:#FAC775;font-weight:500;margin-bottom:14px}
  .page-title{font-size:46px;line-height:1.05;font-weight:500;margin:0 0 10px}
  .page-subtitle{font-size:15.5px;color:rgba(255,245,240,0.7);line-height:1.5}

  .feed-layout{max-width:780px;margin:0 auto;padding:0 32px 50px}

  .filters-bar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;padding-bottom:14px;border-bottom:0.5px solid rgba(255,245,240,0.06)}
  .filters-chips{display:flex;gap:7px;flex-wrap:wrap;flex:1}
  .fchip{padding:7px 13px;background:rgba(255,245,240,0.04);border:0.5px solid rgba(255,245,240,0.14);border-radius:18px;font-size:12px;color:rgba(255,245,240,0.7);cursor:pointer;font-family:inherit;transition:all 0.22s;white-space:nowrap}
  .fchip:hover{background:rgba(255,245,240,0.08);color:#FFF5F0}
  .fchip.active{background:linear-gradient(135deg,rgba(212,163,86,0.2),rgba(212,163,86,0.06));border-color:rgba(212,163,86,0.6);color:#FAC775}
  .search-wrap{position:relative}
  .search-input{padding:10px 14px 10px 38px;background:rgba(255,245,240,0.04);border:0.5px solid rgba(255,245,240,0.12);border-radius:22px;color:#FFF5F0;font-size:13px;outline:none;width:200px;font-family:inherit}
  .search-input:focus{border-color:rgba(212,163,86,0.5)}

  /* Composer */
  .composer{background:rgba(255,245,240,0.03);border:0.5px solid rgba(255,245,240,0.08);border-radius:14px;padding:18px;margin-bottom:24px}
  .composer-row{display:flex;gap:12px;align-items:flex-start}
  .avatar-circle{border-radius:50%;flex-shrink:0;border:0.5px solid rgba(255,245,240,0.15);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-style:italic;font-weight:500;color:#FFF5F0}
  .composer-avatar{width:42px;height:42px;font-size:17px}
  .composer-input{flex:1;padding:14px 16px;background:rgba(255,245,240,0.04);border:0.5px solid rgba(255,245,240,0.12);border-radius:10px;color:#FFF5F0;font-size:14px;outline:none;font-family:inherit;min-height:48px;resize:vertical}
  .composer-input:focus{border-color:rgba(212,163,86,0.5)}

  .composer-extra{margin-top:14px;padding-left:54px}
  .extra-label{font-size:10.5px;letter-spacing:0.16em;color:rgba(255,245,240,0.5);font-weight:500;margin-bottom:9px}
  .cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .cat-chip{padding:6px 12px;background:rgba(255,245,240,0.04);border:0.5px solid rgba(255,245,240,0.14);border-radius:16px;font-size:11.5px;color:rgba(255,245,240,0.7);cursor:pointer;font-family:inherit;transition:all 0.22s}
  .cat-chip.selected{background:linear-gradient(135deg,rgba(184,41,74,0.25),rgba(184,41,74,0.08));border-color:rgba(232,184,196,0.6);color:#E8B8C4}

  .hashtag-chips{display:flex;gap:6px;flex-wrap:wrap}
  .hashtag-chip{padding:7px 13px;background:rgba(255,245,240,0.04);border:0.5px solid rgba(255,245,240,0.15);border-radius:18px;font-size:12px;color:rgba(255,245,240,0.75);cursor:pointer;transition:all 0.25s cubic-bezier(0.34,1.4,0.64,1);font-family:inherit;user-select:none}
  .hashtag-chip:hover{transform:translateY(-1px);background:rgba(255,245,240,0.08);color:#FFF5F0}
  .hashtag-chip.selected{background:linear-gradient(135deg,rgba(212,163,86,0.2),rgba(212,163,86,0.08));border-color:#FAC775;color:#FAC775;box-shadow:0 0 0 0.5px rgba(212,163,86,0.3),0 4px 12px rgba(212,163,86,0.15)}

  .composer-preview{margin-top:12px;position:relative;border-radius:10px;overflow:hidden;max-width:280px}
  .composer-preview img{width:100%;display:block}
  .composer-preview button{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;background:rgba(14,5,9,0.85);border:none;color:#FF8090;cursor:pointer;display:flex;align-items:center;justify-content:center}

  .composer-tools{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:0.5px solid rgba(255,245,240,0.06);padding-left:54px;flex-wrap:wrap;gap:10px}
  .composer-tools-left{display:flex;gap:6px;align-items:center}
  .tool-btn{padding:8px 12px;background:transparent;border:0.5px solid rgba(255,245,240,0.12);border-radius:8px;color:rgba(255,245,240,0.65);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.25s;font-family:inherit}
  .tool-btn:hover{background:rgba(255,245,240,0.04);color:#FFF5F0}
  .post-btn{padding:9px 22px;font-size:11.5px;font-weight:500;border-radius:9px;letter-spacing:0.1em;border:none;cursor:pointer}
  .post-btn:disabled{opacity:0.5;cursor:not-allowed}

  /* Posts */
  .post{background:rgba(255,245,240,0.03);border:0.5px solid rgba(255,245,240,0.08);border-radius:14px;padding:18px;margin-bottom:14px;transition:border-color 0.25s}
  .post:hover{border-color:rgba(255,245,240,0.18)}
  .post.pinned{border:0.5px solid rgba(212,163,86,0.4);background:linear-gradient(135deg,rgba(212,163,86,0.05),transparent)}

  .post-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
  .post-avatar{width:40px;height:40px;font-size:16px}
  .post-avatar.fundadora{border:1.5px solid #FAC775}
  .post-author-info{flex:1;min-width:0}
  .post-author-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .post-author-name{font-size:13.5px;font-weight:500}
  .role-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:rgba(212,163,86,0.15);border:0.5px solid rgba(212,163,86,0.4);border-radius:5px;font-size:9.5px;color:#FAC775;font-weight:500;letter-spacing:0.06em}
  .pinned-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:rgba(232,184,196,0.14);border:0.5px solid rgba(232,184,196,0.4);border-radius:5px;font-size:9.5px;color:#E8B8C4;font-weight:500;letter-spacing:0.06em}
  .post-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,245,240,0.5);margin-top:2px}
  .post-menu{position:relative}
  .post-menu-btn{background:transparent;border:none;color:rgba(255,245,240,0.45);cursor:pointer;padding:6px;border-radius:6px;font-family:inherit}
  .post-menu-btn:hover{background:rgba(255,245,240,0.06);color:#FFF5F0}
  .post-menu-drop{position:absolute;right:0;top:32px;background:#2D0A18;border:0.5px solid rgba(255,245,240,0.14);border-radius:10px;padding:5px;min-width:150px;z-index:50;display:none;box-shadow:0 12px 30px rgba(0,0,0,0.5)}
  .post-menu-drop.show{display:block}
  .post-menu-item{display:block;width:100%;text-align:left;padding:9px 12px;background:transparent;border:none;color:rgba(255,245,240,0.85);font-size:12.5px;cursor:pointer;border-radius:7px;font-family:inherit}
  .post-menu-item:hover{background:rgba(255,245,240,0.07)}
  .post-menu-item.danger{color:#FF8090}

  .post-body{font-size:14px;line-height:1.55;color:rgba(255,245,240,0.88);margin:0 0 14px;white-space:pre-wrap;word-wrap:break-word}
  .hashtag{color:#FAC775;font-weight:500}
  .post-image{width:100%;border-radius:10px;margin-bottom:14px;display:block;max-height:460px;object-fit:cover}

  .post-actions{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:0.5px solid rgba(255,245,240,0.06)}
  .pa-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;background:transparent;border:none;color:rgba(255,245,240,0.65);font-size:12px;cursor:pointer;border-radius:7px;font-family:inherit;transition:all 0.2s}
  .pa-btn:hover{background:rgba(255,245,240,0.05);color:#FFF5F0}
  .pa-btn.liked{color:#FAC775}

  /* Comentarios */
  .comments-box{margin-top:12px;padding-top:12px;border-top:0.5px solid rgba(255,245,240,0.06);display:none}
  .comments-box.show{display:block}
  .comment{display:flex;gap:10px;margin-bottom:12px}
  .comment-avatar{width:30px;height:30px;font-size:12px}
  .comment-bubble{flex:1;background:rgba(255,245,240,0.04);border-radius:10px;padding:9px 12px}
  .comment-author{font-size:12px;font-weight:500;color:#FFF5F0;margin-bottom:2px}
  .comment-text{font-size:12.5px;color:rgba(255,245,240,0.82);line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .comment-time{font-size:10.5px;color:rgba(255,245,240,0.4);margin-top:4px}
  .comment-del{background:none;border:none;color:rgba(255,128,144,0.7);font-size:10.5px;cursor:pointer;padding:0;margin-top:4px;margin-left:10px;font-family:inherit}
  .comment-form{display:flex;gap:9px;align-items:center;margin-top:10px}
  .comment-input{flex:1;padding:10px 13px;background:rgba(255,245,240,0.04);border:0.5px solid rgba(255,245,240,0.12);border-radius:20px;color:#FFF5F0;font-size:13px;outline:none;font-family:inherit}
  .comment-input:focus{border-color:rgba(212,163,86,0.5)}
  .comment-send{padding:9px 16px;border-radius:20px;border:none;background:linear-gradient(135deg,#FAC775,#D4A356);color:#3D1208;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}

  .feed-empty{padding:60px 20px;text-align:center;color:rgba(255,245,240,0.55)}
  .feed-loading{padding:50px 20px;text-align:center}
  .fspinner{width:34px;height:34px;border:3px solid rgba(212,163,86,0.2);border-top-color:#FAC775;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{position:fixed;bottom:30px;right:30px;background:linear-gradient(135deg,#5DCAA5,#9FE1CB);color:#0E0509;padding:14px 22px;border-radius:11px;font-size:13px;font-weight:500;box-shadow:0 12px 32px rgba(93,202,165,0.4);z-index:2000;display:none;align-items:center;gap:9px;animation:slideUp 0.3s ease-out}
  .toast.show{display:flex}
  .toast.error{background:linear-gradient(135deg,#FF8090,#C8203A);color:#FFF5F0}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

  @media (max-width:768px){
    .page-hero{padding:30px 16px 20px}
    .page-title{font-size:32px}
    .page-title .serif-it{font-size:32px !important}
    .feed-layout{padding:0 16px 30px}
    .search-input{width:100%}
    .search-wrap{width:100%}
    .composer-tools{padding-left:0}
    .composer-extra{padding-left:0}
    .filters-chips{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
    .toast{left:16px;right:16px;bottom:16px;justify-content:center}
  }
</style>

<script>
// ═══════════════════════════════════════════════════════════════════
// COMUNIDAD CMM - conectada a Supabase
// ═══════════════════════════════════════════════════════════════════

let usuarioActual = null;
let perfilActual = null;
let esAdmin = false;

let posts = [];
let perfilesCache = {};
let likesPorPost = {};
let misLikes = new Set();
let comentariosPorPost = {};

let categoriaPost = 'general';
let hashtagsDisponibles = [];
let hashtagsSeleccionados = [];
let fotoPostUrl = null;

let filtroCategoria = 'todos';
let textoBusqueda = '';

// ─── Utilidades ────────────────────────────────────────────────────
function escapeHtml(t){
  if(!t) return '';
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function colorDeNombre(nombre){
  const paletas = [
    'linear-gradient(135deg,#7A1B2E,#E8B8C4)',
    'linear-gradient(135deg,#4A0F1E,#B8294A)',
    'linear-gradient(135deg,#D4A356,#E8B8C4)',
    'linear-gradient(135deg,#7A1B2E,#C97990)',
    'linear-gradient(135deg,#3D1208,#D4A356)',
    'linear-gradient(135deg,#B8294A,#FAC775)'
  ];
  let h = 0;
  for(let i=0;i<(nombre||'x').length;i++) h = (h + (nombre||'x').charCodeAt(i)) % paletas.length;
  return paletas[h];
}

function inicial(nombre){
  return (nombre || 'A').trim().charAt(0).toUpperCase();
}

function tiempoRelativo(fecha){
  if(!fecha) return '';
  const seg = Math.floor((Date.now() - new Date(fecha).getTime())/1000);
  if(seg < 60) return 'hace un momento';
  const min = Math.floor(seg/60);
  if(min < 60) return 'hace ' + min + ' min';
  const hr = Math.floor(min/60);
  if(hr < 24) return 'hace ' + hr + ' h';
  const dias = Math.floor(hr/24);
  if(dias < 7) return 'hace ' + dias + (dias === 1 ? ' día' : ' días');
  const d = new Date(fecha);
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d.getDate() + ' ' + meses[d.getMonth()];
}

function resaltarHashtags(texto){
  return escapeHtml(texto).replace(/#([\wáéíóúñÁÉÍÓÚÑ]+)/g, '<span class="hashtag">#$1</span>');
}

function mostrarToast(msg, esError){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.toggle('error', !!esError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

// ─── Composer ──────────────────────────────────────────────────────
function elegirCategoria(el){
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  categoriaPost = el.dataset.cat;
}

async function cargarHashtagsDisponibles(){
  const { data } = await sb.from('hashtags').select('nombre').order('nombre', { ascending: true });
  hashtagsDisponibles = (data || []).map(h => h.nombre);
  const cont = document.getElementById('hashtagChips');
  if(hashtagsDisponibles.length === 0){
    cont.innerHTML = '<div style="font-size:11.5px;color:rgba(255,245,240,0.4);font-style:italic">No hay etiquetas todavía</div>';
    return;
  }
  cont.innerHTML = hashtagsDisponibles.map(h =>
    `<button class="hashtag-chip" data-tag="${escapeHtml(h)}" onclick="toggleHashtag(this)" type="button">#${escapeHtml(h)}</button>`
  ).join('');
}

function toggleHashtag(el){
  const tag = el.dataset.tag;
  if(hashtagsSeleccionados.includes(tag)){
    hashtagsSeleccionados = hashtagsSeleccionados.filter(t => t !== tag);
    el.classList.remove('selected');
  } else {
    hashtagsSeleccionados.push(tag);
    el.classList.add('selected');
  }
}

async function subirFotoPost(event){
  const file = event.target.files[0];
  if(!file) return;
  if(file.size > 5 * 1024 * 1024){
    mostrarToast('La foto no puede pesar más de 5 MB', true);
    return;
  }
  document.getElementById('fotoBtnText').textContent = 'Subiendo...';
  const r = await subirImagen(file, 'posts');
  document.getElementById('fotoBtnText').textContent = 'Foto';
  if(r.exito){
    fotoPostUrl = r.url;
    document.getElementById('composerPreviewImg').src = r.url;
    document.getElementById('composerPreview').style.display = 'block';
  } else {
    mostrarToast('No se pudo subir: ' + r.error, true);
  }
  event.target.value = '';
}

function quitarFotoPost(){
  fotoPostUrl = null;
  document.getElementById('composerPreview').style.display = 'none';
  document.getElementById('composerPreviewImg').src = '';
}

async function publicar(){
  const texto = document.getElementById('composerText').value.trim();
  if(!texto && !fotoPostUrl){
    mostrarToast('Escribí algo o subí una foto ✏️', true);
    return;
  }

  const btn = document.getElementById('btnPublicar');
  btn.disabled = true;
  btn.textContent = 'PUBLICANDO...';

  const { error } = await sb.from('posts').insert({
    usuario_id: usuarioActual.id,
    contenido: texto,
    categoria: categoriaPost,
    hashtags: hashtagsSeleccionados.length ? hashtagsSeleccionados : null,
    imagen_url: fotoPostUrl
  });

  btn.disabled = false;
  btn.textContent = 'PUBLICAR';

  if(error){
    mostrarToast('Error al publicar: ' + error.message, true);
    return;
  }

  // Limpiar composer
  document.getElementById('composerText').value = '';
  hashtagsSeleccionados = [];
  document.querySelectorAll('.hashtag-chip.selected').forEach(c => c.classList.remove('selected'));
  quitarFotoPost();
  mostrarToast('✓ Publicado en la comunidad');

  await cargarFeed();
}

// ─── Feed ──────────────────────────────────────────────────────────
async function cargarFeed(){
  const { data: postsData, error } = await sb
    .from('posts')
    .select('*')
    .order('fijado', { ascending: false })
    .order('creado_en', { ascending: false })
    .limit(60);

  if(error){
    document.getElementById('feed').innerHTML =
      '<div class="feed-empty"><div style="font-size:42px;opacity:0.4;margin-bottom:12px">⚠️</div>' +
      '<div style="font-size:14px">No se pudo cargar el feed</div>' +
      '<div style="font-size:12px;color:rgba(255,245,240,0.4);margin-top:6px">' + escapeHtml(error.message) + '</div></div>';
    return;
  }

  posts = postsData || [];

  if(posts.length === 0){
    renderFeed();
    return;
  }

  const idsPost = posts.map(p => p.id);
  const idsUsuario = [...new Set(posts.map(p => p.usuario_id).filter(Boolean))];

  // Perfiles de los autores
  if(idsUsuario.length){
    const { data: perfiles } = await sb
      .from('perfiles')
      .select('id, nombre, email, rol, avatar_url')
      .in('id', idsUsuario);
    (perfiles || []).forEach(p => { perfilesCache[p.id] = p; });
  }

  // Likes
  likesPorPost = {};
  misLikes = new Set();
  const { data: likes } = await sb.from('likes').select('post_id, usuario_id').in('post_id', idsPost);
  (likes || []).forEach(l => {
    likesPorPost[l.post_id] = (likesPorPost[l.post_id] || 0) + 1;
    if(l.usuario_id === usuarioActual.id) misLikes.add(l.post_id);
  });

  // Comentarios
  comentariosPorPost = {};
  const { data: comentarios } = await sb
    .from('comentarios')
    .select('*')
    .in('post_id', idsPost)
    .order('creado_en', { ascending: true });

  const idsComentaristas = [...new Set((comentarios || []).map(c => c.usuario_id).filter(Boolean))]
    .filter(id => !perfilesCache[id]);
  if(idsComentaristas.length){
    const { data: perfilesC } = await sb
      .from('perfiles')
      .select('id, nombre, email, rol, avatar_url')
      .in('id', idsComentaristas);
    (perfilesC || []).forEach(p => { perfilesCache[p.id] = p; });
  }

  (comentarios || []).forEach(c => {
    if(!comentariosPorPost[c.post_id]) comentariosPorPost[c.post_id] = [];
    comentariosPorPost[c.post_id].push(c);
  });

  renderFeed();
}

function nombreDe(usuarioId){
  const p = perfilesCache[usuarioId];
  if(!p) return 'Miembro de la comunidad';
  return p.nombre || (p.email ? p.email.split('@')[0] : 'Miembro');
}

function rolDe(usuarioId){
  return perfilesCache[usuarioId]?.rol || 'alumna';
}

function avatarHtml(usuarioId, clase){
  const nombre = nombreDe(usuarioId);
  const rol = rolDe(usuarioId);
  const esFund = rol === 'fundadora' || rol === 'admin';
  const url = perfilesCache[usuarioId]?.avatar_url;
  const style = url
    ? `background-image:url('${escapeHtml(url)}');background-size:cover;background-position:center`
    : `background:${colorDeNombre(nombre)}`;
  return `<div class="avatar-circle ${clase} ${esFund ? 'fundadora' : ''}" style="${style}">${url ? '' : inicial(nombre)}</div>`;
}

function postVisible(p){
  if(filtroCategoria !== 'todos' && (p.categoria || 'general') !== filtroCategoria) return false;
  if(textoBusqueda){
    const q = textoBusqueda.toLowerCase().replace('#','');
    const enTexto = (p.contenido || '').toLowerCase().includes(q);
    const enTags = (p.hashtags || []).some(t => t.toLowerCase().includes(q));
    const enAutor = nombreDe(p.usuario_id).toLowerCase().includes(q);
    if(!enTexto && !enTags && !enAutor) return false;
  }
  return true;
}

function renderFeed(){
  const feed = document.getElementById('feed');
  const lista = posts.filter(postVisible);

  if(lista.length === 0){
    const vacio = posts.length === 0;
    feed.innerHTML = `
      <div class="feed-empty">
        <div style="font-size:46px;opacity:0.4;margin-bottom:14px">${vacio ? '💬' : '🔍'}</div>
        <div style="font-size:15px;margin-bottom:6px">${vacio ? 'Todavía no hay publicaciones' : 'No encontramos nada'}</div>
        <div style="font-size:12.5px;color:rgba(255,245,240,0.45)">${vacio ? 'Sé la primera en compartir algo con la comunidad' : 'Probá con otra palabra o categoría'}</div>
      </div>`;
    return;
  }

  feed.innerHTML = lista.map(p => {
    const nombre = escapeHtml(nombreDe(p.usuario_id));
    const rol = rolDe(p.usuario_id);
    const esFund = rol === 'fundadora' || rol === 'admin';
    const nLikes = likesPorPost[p.id] || 0;
    const yoDiLike = misLikes.has(p.id);
    const coments = comentariosPorPost[p.id] || [];
    const puedeBorrar = p.usuario_id === usuarioActual.id || esAdmin;

    const tags = (p.hashtags || []).map(t => `<span class="hashtag">#${escapeHtml(t)}</span>`).join(' ');

    return `
      <div class="post ${p.fijado ? 'pinned' : ''}" id="post-${p.id}">
        <div class="post-head">
          ${avatarHtml(p.usuario_id, 'post-avatar')}
          <div class="post-author-info">
            <div class="post-author-row">
              <span class="post-author-name">${nombre}</span>
              ${esFund ? '<span class="role-tag">💎 FUNDADORA</span>' : ''}
              ${p.fijado ? '<span class="pinned-tag">📌 FIJADO</span>' : ''}
            </div>
            <div class="post-meta">
              <span>${tiempoRelativo(p.creado_en)}</span>
              ${p.categoria && p.categoria !== 'general' ? '<span>·</span><span>' + escapeHtml(p.categoria) + '</span>' : ''}
            </div>
          </div>
          ${(puedeBorrar || esAdmin) ? `
          <div class="post-menu">
            <button class="post-menu-btn" onclick="toggleMenu('${p.id}', event)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
            </button>
            <div class="post-menu-drop" id="menu-${p.id}">
              ${esAdmin ? `<button class="post-menu-item" onclick="fijarPost('${p.id}', ${!p.fijado})">${p.fijado ? 'Quitar de fijados' : '📌 Fijar arriba'}</button>` : ''}
              ${puedeBorrar ? `<button class="post-menu-item danger" onclick="borrarPost('${p.id}')">Eliminar post</button>` : ''}
            </div>
          </div>` : ''}
        </div>

        ${p.contenido ? `<p class="post-body">${resaltarHashtags(p.contenido)}</p>` : ''}
        ${tags ? `<p class="post-body" style="margin-top:-8px">${tags}</p>` : ''}
        ${p.imagen_url ? `<img class="post-image" src="${escapeHtml(p.imagen_url)}" alt="" loading="lazy">` : ''}

        <div class="post-actions">
          <button class="pa-btn ${yoDiLike ? 'liked' : ''}" onclick="toggleLike('${p.id}')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="${yoDiLike ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 3h12l4 6-10 13L2 9z"/><path d="M2 9h20M9.5 3 8 9l4 13M14.5 3 16 9l-4 13"/></svg>
            <span id="likes-${p.id}">${nLikes}</span>
          </button>
          <button class="pa-btn" onclick="toggleComentarios('${p.id}')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.1A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            ${coments.length} ${coments.length === 1 ? 'comentario' : 'comentarios'}
          </button>
        </div>

        <div class="comments-box" id="comments-${p.id}">
          <div id="comments-list-${p.id}">${renderComentarios(p.id)}</div>
          <div class="comment-form">
            ${avatarHtml(usuarioActual.id, 'comment-avatar')}
            <input class="comment-input" id="cinput-${p.id}" placeholder="Escribí un comentario..." onkeydown="if(event.key==='Enter')comentar('${p.id}')">
            <button class="comment-send" onclick="comentar('${p.id}')">ENVIAR</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

function renderComentarios(postId){
  const lista = comentariosPorPost[postId] || [];
  if(lista.length === 0){
    return '<div style="font-size:12px;color:rgba(255,245,240,0.4);font-style:italic;margin-bottom:8px">Todavía no hay comentarios. Sé la primera.</div>';
  }
  return lista.map(c => {
    const puedeBorrar = c.usuario_id === usuarioActual.id || esAdmin;
    return `
      <div class="comment">
        ${avatarHtml(c.usuario_id, 'comment-avatar')}
        <div class="comment-bubble">
          <div class="comment-author">${escapeHtml(nombreDe(c.usuario_id))}</div>
          <div class="comment-text">${resaltarHashtags(c.contenido)}</div>
          <div style="display:flex;align-items:center">
            <span class="comment-time">${tiempoRelativo(c.creado_en)}</span>
            ${puedeBorrar ? `<button class="comment-del" onclick="borrarComentario('${c.id}')">Eliminar</button>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

// ─── Acciones ──────────────────────────────────────────────────────
function toggleMenu(id, ev){
  ev.stopPropagation();
  document.querySelectorAll('.post-menu-drop').forEach(m => {
    if(m.id !== 'menu-' + id) m.classList.remove('show');
  });
  document.getElementById('menu-' + id).classList.toggle('show');
}
document.addEventListener('click', () => {
  document.querySelectorAll('.post-menu-drop').forEach(m => m.classList.remove('show'));
});

async function toggleLike(postId){
  const yaDiLike = misLikes.has(postId);

  // Optimista
  if(yaDiLike){
    misLikes.delete(postId);
    likesPorPost[postId] = Math.max(0, (likesPorPost[postId] || 1) - 1);
  } else {
    misLikes.add(postId);
    likesPorPost[postId] = (likesPorPost[postId] || 0) + 1;
  }
  renderFeed();

  if(yaDiLike){
    await sb.from('likes').delete().eq('post_id', postId).eq('usuario_id', usuarioActual.id);
  } else {
    const { error } = await sb.from('likes').insert({ post_id: postId, usuario_id: usuarioActual.id });
    if(error && !String(error.message).includes('duplicate')){
      mostrarToast('No se pudo dar like', true);
    }
  }
}

function toggleComentarios(postId){
  document.getElementById('comments-' + postId).classList.toggle('show');
}

async function comentar(postId){
  const input = document.getElementById('cinput-' + postId);
  const texto = input.value.trim();
  if(!texto) return;
  input.value = '';

  const { error } = await sb.from('comentarios').insert({
    post_id: postId,
    usuario_id: usuarioActual.id,
    contenido: texto
  });

  if(error){
    mostrarToast('No se pudo comentar: ' + error.message, true);
    return;
  }

  if(!comentariosPorPost[postId]) comentariosPorPost[postId] = [];
  comentariosPorPost[postId].push({
    id: 'tmp-' + Date.now(),
    post_id: postId,
    usuario_id: usuarioActual.id,
    contenido: texto,
    creado_en: new Date().toISOString()
  });

  renderFeed();
  document.getElementById('comments-' + postId).classList.add('show');
  await cargarFeed();
  document.getElementById('comments-' + postId)?.classList.add('show');
}

async function borrarComentario(id){
  if(!confirm('¿Eliminar este comentario?')) return;
  const { error } = await sb.from('comentarios').delete().eq('id', id);
  if(error) return mostrarToast('Error: ' + error.message, true);
  mostrarToast('Comentario eliminado');
  await cargarFeed();
}

async function borrarPost(id){
  if(!confirm('¿Eliminar esta publicación? No se puede deshacer.')) return;
  const { error } = await sb.from('posts').delete().eq('id', id);
  if(error) return mostrarToast('Error: ' + error.message, true);
  mostrarToast('Publicación eliminada');
  await cargarFeed();
}

async function fijarPost(id, valor){
  const { error } = await sb.from('posts').update({ fijado: valor }).eq('id', id);
  if(error) return mostrarToast('Error: ' + error.message, true);
  mostrarToast(valor ? '📌 Post fijado arriba' : 'Post desfijado');
  await cargarFeed();
}

function filtrarCat(el){
  document.querySelectorAll('.fchip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  filtroCategoria = el.dataset.cat;
  renderFeed();
}

document.getElementById('buscarPosts').addEventListener('input', e => {
  textoBusqueda = e.target.value.trim();
  renderFeed();
});

// ─── Init ──────────────────────────────────────────────────────────
const waitSupaCom = setInterval(async () => {
  if(typeof sb === 'undefined' || sb === null) return;
  clearInterval(waitSupaCom);

  const { data: { user } } = await sb.auth.getUser();
  if(!user){
    window.location.replace('/login');
    return;
  }

  usuarioActual = user;

  const { data: perfil } = await sb
    .from('perfiles')
    .select('id, nombre, email, rol, avatar_url')
    .eq('id', user.id)
    .maybeSingle();

  // Si por algún motivo no se creó el perfil, lo creamos ahora
  if(!perfil){
    const nombreAuto = user.user_metadata?.nombre || user.email.split('@')[0];
    await sb.from('perfiles').upsert({
      id: user.id,
      email: user.email,
      nombre: nombreAuto,
      rol: 'alumna'
    });
    perfil = { id: user.id, email: user.email, nombre: nombreAuto, rol: 'alumna' };
  }

  perfilActual = perfil;
  perfilesCache[user.id] = perfilActual;
  esAdmin = ['admin','fundadora'].includes(perfilActual.rol);

  if(esAdmin) document.getElementById('chipAnuncio').style.display = '';

  // Avatar del composer
  const mi = document.getElementById('miAvatar');
  const nombreMio = perfilActual.nombre || perfilActual.email.split('@')[0];
  if(perfilActual.avatar_url){
    mi.style.backgroundImage = `url('${perfilActual.avatar_url}')`;
    mi.style.backgroundSize = 'cover';
    mi.style.backgroundPosition = 'center';
    mi.textContent = '';
  } else {
    mi.style.background = colorDeNombre(nombreMio);
    mi.textContent = inicial(nombreMio);
  }

  // Mostrar página
  document.getElementById('auth-splash-style')?.remove();
  document.getElementById('authSplash')?.remove();

  await cargarHashtagsDisponibles();
  await cargarFeed();
}, 50);
</script>

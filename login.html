<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Milena Machado</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1A0A12">

<link rel="stylesheet" href="styles.css">
<style>
  body{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:40px 20px}

  .back-btn{position:fixed;top:24px;left:24px;width:42px;height:42px;border-radius:50%;background:rgba(255,245,240,0.06);border:0.5px solid rgba(255,245,240,0.2);color:#FFF5F0;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(12px);z-index:5;text-decoration:none;transition:all 0.25s}
  .back-btn:hover{background:rgba(255,245,240,0.1);transform:translateX(-2px)}

  .login-glow-1{position:fixed;width:520px;height:520px;left:-180px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(232,184,196,0.4) 0%,rgba(232,184,196,0) 65%);pointer-events:none;z-index:0}
  .login-glow-2{position:fixed;width:380px;height:380px;right:-100px;bottom:-100px;border-radius:50%;background:radial-gradient(circle,rgba(184,41,74,0.5) 0%,rgba(184,41,74,0) 65%);pointer-events:none;z-index:0}
  .login-glow-3{position:fixed;width:240px;height:240px;left:50%;top:30%;border-radius:50%;background:radial-gradient(circle,rgba(212,163,86,0.32) 0%,rgba(212,163,86,0) 70%);pointer-events:none;z-index:0}

  .login-card{position:relative;width:100%;max-width:420px;z-index:1}

  .logo-stack{display:flex;flex-direction:column;align-items:center;margin-bottom:32px}
  .logo-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .logo-mark{width:48px;height:48px;border:0.5px solid rgba(255,245,240,0.55);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-style:italic;font-size:24px;font-weight:500}
  .logo-words{font-size:15px;line-height:1.15;letter-spacing:0.16em;font-weight:500}
  .tagline{font-size:13px;color:rgba(232,184,196,0.85);text-align:center}

  .tabs-row{display:flex;gap:6px;background:rgba(255,245,240,0.04);border:0.5px solid rgba(255,245,240,0.1);border-radius:12px;padding:4px;margin-bottom:24px}
  .tab-btn{flex:1;padding:11px;font-size:12px;font-weight:500;letter-spacing:0.16em;color:rgba(255,245,240,0.55);cursor:pointer;border-radius:9px;transition:all 0.25s;background:transparent;border:none;font-family:inherit}
  .tab-btn.active{background:linear-gradient(135deg,#FAC775,#D4A356);color:#3D1208}

  .tab-content{display:none}
  .tab-content.active{display:block}

  .login-title{font-size:30px;font-weight:500;text-align:center;margin:0 0 6px;letter-spacing:-0.02em}
  .login-subtitle{font-size:13px;color:rgba(255,245,240,0.6);text-align:center;margin:0 0 28px;line-height:1.5}

  .field-group{margin-bottom:18px}
  .field-label{font-size:10px;letter-spacing:0.2em;color:rgba(255,245,240,0.5);font-weight:500;display:block;margin-bottom:7px}
  .input-wrap{position:relative}
  .input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none}
  .input-padded{width:100%;padding:14px 16px 14px 44px;background:rgba(255,245,240,0.04);border:0.5px solid rgba(255,245,240,0.15);border-radius:11px;color:#FFF5F0;font-size:14px;outline:none;box-sizing:border-box;font-family:inherit;transition:border-color 0.2s}
  .input-padded:focus{border-color:rgba(212,163,86,0.5)}

  .input-padded{padding-right:46px}
  .ver-pass{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,245,240,0.45);cursor:pointer;padding:4px;display:flex}
  .ver-pass:hover{color:#FFF5F0}
  .forgot-row{text-align:right;margin-bottom:18px}
  .forgot-link{font-size:12px;color:rgba(232,184,196,0.7);cursor:pointer;text-decoration:none;background:none;border:none;font-family:inherit}
  .forgot-link:hover{color:#E8B8C4}

  .submit-btn{width:100%;padding:16px;font-size:13px;font-weight:500;border-radius:12px;letter-spacing:0.18em;border:none;cursor:pointer}
  .submit-btn:disabled{opacity:0.6;cursor:not-allowed}

  .alert{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:18px;display:none;align-items:flex-start;gap:10px;line-height:1.45}
  .alert.show{display:flex}
  .alert.error{background:rgba(255,59,71,0.1);border:0.5px solid rgba(255,59,71,0.4);color:#FF8090}
  .alert.success{background:rgba(93,202,165,0.1);border:0.5px solid rgba(93,202,165,0.4);color:#9FE1CB}
  .alert.info{background:rgba(212,163,86,0.1);border:0.5px solid rgba(212,163,86,0.4);color:#FAC775}

  .loading-dots{display:inline-flex;gap:4px}
  .loading-dots span{width:6px;height:6px;border-radius:50%;background:currentColor;animation:loadingDot 1.4s ease-in-out infinite both}
  .loading-dots span:nth-child(2){animation-delay:0.16s}
  .loading-dots span:nth-child(3){animation-delay:0.32s}
  @keyframes loadingDot{0%,80%,100%{opacity:0.3;transform:scale(0.8)}40%{opacity:1;transform:scale(1)}}

  /* ── Pantalla de código ── */
  .codigo-icon{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,rgba(212,163,86,0.25),rgba(212,163,86,0.06));border:0.5px solid rgba(212,163,86,0.5);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:popIn 0.45s cubic-bezier(0.34,1.6,0.64,1)}
  @keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}

  .codigo-email{color:#FAC775;font-weight:500;word-break:break-all}

  .codigo-inputs{display:flex;gap:8px;justify-content:center;margin-bottom:22px}
  .codigo-box{width:46px;height:56px;text-align:center;font-size:24px;font-weight:600;font-family:Georgia,serif;background:rgba(255,245,240,0.05);border:1px solid rgba(255,245,240,0.18);border-radius:11px;color:#FFF5F0;outline:none;transition:all 0.2s;-moz-appearance:textfield}
  .codigo-box::-webkit-outer-spin-button,.codigo-box::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .codigo-box:focus{border-color:#FAC775;background:rgba(212,163,86,0.1);box-shadow:0 0 0 3px rgba(212,163,86,0.15);transform:translateY(-2px)}
  .codigo-box.lleno{border-color:rgba(212,163,86,0.6);background:rgba(212,163,86,0.08)}

  .reenviar-row{text-align:center;margin-top:18px;font-size:12.5px;color:rgba(255,245,240,0.55)}
  .reenviar-btn{background:none;border:none;color:#FAC775;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:500;text-decoration:underline}
  .reenviar-btn:disabled{color:rgba(255,245,240,0.35);cursor:not-allowed;text-decoration:none}

  .volver-row{text-align:center;margin-top:14px}
  .volver-btn{background:none;border:none;color:rgba(255,245,240,0.5);font-size:12px;cursor:pointer;font-family:inherit}
  .volver-btn:hover{color:#FFF5F0}

  .spam-tip{margin-top:20px;padding:11px 13px;background:rgba(255,245,240,0.04);border-radius:9px;font-size:11.5px;color:rgba(255,245,240,0.55);line-height:1.5;text-align:center}

  @media (max-width:480px){
    .login-title{font-size:24px}
    .logo-mark{width:42px;height:42px;font-size:21px}
    .codigo-box{width:42px;height:52px;font-size:21px}
    .codigo-inputs{gap:6px}
  }
</style>
</head>

<a href="/index" class="back-btn">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
</a>

<div class="login-glow-1"></div>
<div class="login-glow-2"></div>
<div class="login-glow-3"></div>

<div class="login-card">
  <div class="logo-stack">
    <div class="logo-row">
      <div class="logo-mark">M</div>
      <div class="logo-words">MILENA<br>MACHADO</div>
    </div>
    <div class="tagline serif-it">Creando Mentes Millonarias</div>
  </div>

  <div class="alert" id="alertBox">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01" stroke-linecap="round"/></svg>
    <span id="alertText"></span>
  </div>

  <!-- Tabs -->
  <div class="tabs-row" id="tabsRow">
    <button class="tab-btn active" onclick="cambiarTab('entrar')" id="tabEntrar">ENTRAR</button>
    <button class="tab-btn" onclick="cambiarTab('registro')" id="tabRegistro">REGISTRARSE</button>
  </div>

  <!-- ═══ ENTRAR ═══ -->
  <div class="tab-content active" id="content-entrar">
    <h1 class="login-title serif">Bienvenida <span class="serif-it gradtext" style="font-size:30px">de nuevo</span></h1>
    <p class="login-subtitle">Entrá para seguir con tus cursos</p>

    <div class="field-group">
      <label class="field-label">EMAIL</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,245,240,0.45)" stroke-width="1.7"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
        <input class="input-padded" type="email" id="loginEmail" placeholder="vos@ejemplo.com" autocomplete="email">
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">CONTRASEÑA</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,245,240,0.45)" stroke-width="1.7"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input class="input-padded" type="password" id="loginPass" placeholder="Tu contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')hacerLogin()">
        <button class="ver-pass" type="button" onclick="verPass('loginPass', this)" aria-label="Ver contraseña">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="forgot-row">
      <button class="forgot-link" onclick="recuperarContrasena()">¿Olvidaste tu contraseña?</button>
    </div>

    <button class="cta-gold submit-btn" id="btnLogin" onclick="hacerLogin()">ENTRAR</button>
  </div>

  <!-- ═══ REGISTRO ═══ -->
  <div class="tab-content" id="content-registro">
    <h1 class="login-title serif">Creá tu <span class="serif-it gradtext" style="font-size:30px">cuenta</span></h1>
    <p class="login-subtitle">Te mandamos un código para verificar tu email</p>

    <div class="field-group">
      <label class="field-label">NOMBRE</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,245,240,0.45)" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" stroke-linecap="round"/></svg>
        <input class="input-padded" type="text" id="regNombre" placeholder="Tu nombre" autocomplete="name">
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">EMAIL</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,245,240,0.45)" stroke-width="1.7"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
        <input class="input-padded" type="email" id="regEmail" placeholder="vos@ejemplo.com" autocomplete="email">
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">CONTRASEÑA</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,245,240,0.45)" stroke-width="1.7"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input class="input-padded" type="password" id="regPass" placeholder="Mayúscula, número y símbolo" autocomplete="new-password" onkeydown="if(event.key==='Enter')hacerRegistro()">
        <button class="ver-pass" type="button" onclick="verPass('regPass', this)" aria-label="Ver contraseña">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div id="medidorReg"></div>
    </div>

    <button class="cta-gold submit-btn" id="btnRegistro" onclick="hacerRegistro()">CREAR MI CUENTA</button>
  </div>

  <!-- ═══ CÓDIGO DE VERIFICACIÓN ═══ -->
  <div class="tab-content" id="content-codigo">
    <div class="codigo-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FAC775" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
    </div>

    <h1 class="login-title serif">Revisá tu <span class="serif-it gradtext" style="font-size:30px">email</span></h1>
    <p class="login-subtitle">Enviamos un código a<br><span class="codigo-email" id="codigoEmailTxt"></span></p>

    <div class="codigo-inputs" id="codigoInputs"></div>

    <button class="cta-gold submit-btn" id="btnVerificar" onclick="verificarCodigo()">VERIFICAR Y ENTRAR</button>

      ¿No te llegó?
      <button class="reenviar-btn" id="btnReenviar" onclick="reenviarCodigo()">Reenviar código</button>

    <div class="volver-row">
      <button class="volver-btn" onclick="volverDelCodigo()">← Usar otro email</button>

      💡 Si no lo ves, revisá la carpeta de <strong>spam</strong> o <strong>promociones</strong>.
      El código vence en 1 hora.<br>
      <button type="button" onclick="cambiarLargoCodigo()" style="background:none;border:none;color:rgba(255,245,240,0.5);font-size:11px;text-decoration:underline;cursor:pointer;font-family:inherit;margin-top:7px">¿Tu código tiene otra cantidad de dígitos?</button>
    </div>
  </div>

</div>

<script src="supabase-config.js"></script>
<script src="password-fuerza.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// LOGIN + REGISTRO CON VERIFICACIÓN POR CÓDIGO
// ═══════════════════════════════════════════════════════════════════

let emailPendiente = '';
let nombrePendiente = '';
let passPendiente = '';
let cooldownReenvio = 0;
let cooldownTimer = null;

// ─── Ver / ocultar contraseña ──────────────────────────────────────
function verPass(id, btn){
  const i = document.getElementById(id);
  const oculto = i.type === 'password';
  i.type = oculto ? 'text' : 'password';
  btn.innerHTML = oculto
    ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2"/><line x1="2" y1="2" x2="22" y2="22" stroke-linecap="round"/></svg>'
    : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}

// ─── UI helpers ────────────────────────────────────────────────────
function mostrarAlerta(msg, tipo){
  const box = document.getElementById('alertBox');
  document.getElementById('alertText').textContent = msg;
  box.className = 'alert show ' + (tipo || 'error');
}
function ocultarAlerta(){
  document.getElementById('alertBox').className = 'alert';
}

function cambiarTab(tab){
  ocultarAlerta();
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('content-' + tab).classList.add('active');
  document.getElementById('tabsRow').style.display = (tab === 'codigo') ? 'none' : 'flex';
  if(tab !== 'codigo'){
    document.getElementById('tabEntrar').classList.toggle('active', tab === 'entrar');
    document.getElementById('tabRegistro').classList.toggle('active', tab === 'registro');
  }
}

function cargando(btnId, texto){
  const b = document.getElementById(btnId);
  b.disabled = true;
  b.dataset.original = b.dataset.original || b.textContent;
  b.innerHTML = texto + ' <span class="loading-dots"><span></span><span></span><span></span></span>';
}
function listo(btnId){
  const b = document.getElementById(btnId);
  b.disabled = false;
  b.textContent = b.dataset.original || b.textContent;
}

function traducirError(msg){
  const m = (msg || '').toLowerCase();
  if(m.includes('invalid login credentials')) return 'Email o contraseña incorrectos';
  if(m.includes('email not confirmed')) return 'Todavía no verificaste tu email';
  if(m.includes('user already registered') || m.includes('already been registered')) return 'Ese email ya está registrado. Probá entrar o recuperar tu contraseña';
  if(m.includes('password should be at least')) return 'La contraseña necesita al menos 6 caracteres';
  if(m.includes('unable to validate email') || m.includes('invalid format')) return 'Ese email no parece válido';
  if(m.includes('token has expired') || m.includes('expired')) return 'El código venció. Pedí uno nuevo';
  if(m.includes('invalid') && m.includes('token')) return 'El código no es correcto. Revisalo e intentá de nuevo';
  if(m.includes('rate limit') || m.includes('too many')) return 'Demasiados intentos. Esperá unos minutos';
  if(m.includes('error sending') || m.includes('smtp')) return 'No pudimos enviar el email. Avisale al equipo';
  if(m.includes('failed to fetch')) return 'Sin conexión con el servidor. Revisá tu internet';
  return msg || 'Ocurrió un error inesperado';
}

// ─── ENTRAR ────────────────────────────────────────────────────────
async function hacerLogin(){
  ocultarAlerta();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;

  if(!email) return mostrarAlerta('Escribí tu email');
  if(!pass) return mostrarAlerta('Escribí tu contraseña');

  cargando('btnLogin', 'ENTRANDO');

  const { data, error } = await sb.auth.signInWithPassword({ email: email, password: pass });

  if(error){
    listo('btnLogin');
    // Si no confirmó el email, lo mandamos a la pantalla de código
    if((error.message || '').toLowerCase().includes('email not confirmed')){
      emailPendiente = email;
      const seEnvio = await enviarCodigoDeNuevo(true);
      if(seEnvio){
        irAPantallaCodigo(email);
        arrancarCooldown(60);
        mostrarAlerta('Te faltaba verificar tu email. Te mandamos un código nuevo.', 'info');
      } else {
        mostrarAlerta('Tu cuenta existe pero falta verificar el email, y el envío de emails todavía no está configurado. Avisale al equipo para que lo active.', 'info');
      }
      return;
    }
    return mostrarAlerta(traducirError(error.message));
  }

  await refrescarCacheSesion();
  mostrarAlerta('✓ Entrando...', 'success');
  window.location.href = '/index';
}

// ─── REGISTRO ──────────────────────────────────────────────────────
async function hacerRegistro(){
  ocultarAlerta();
  const nombre = document.getElementById('regNombre').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;

  if(!nombre) return mostrarAlerta('Escribí tu nombre');
  if(!email) return mostrarAlerta('Escribí tu email');
  const fuerza = evaluarPassword(pass);
  if(!fuerza.aceptable){
    return mostrarAlerta(fuerza.faltantes[0] || 'Elegí una contraseña más segura');
  }

  cargando('btnRegistro', 'CREANDO');

  const { data, error } = await sb.auth.signUp({
    email: email,
    password: pass,
    options: { data: { nombre: nombre } }
  });

  listo('btnRegistro');

  if(error) return mostrarAlerta(traducirError(error.message));

  // Si Supabase devuelve sesión directa, es que la confirmación está apagada
  if(data.session){
    // Aseguramos que el perfil exista con el nombre puesto
    if(data.user){
      await sb.from('perfiles').upsert({
        id: data.user.id,
        email: email,
        nombre: nombre,
        rol: 'alumna'
      }, { onConflict: 'id' });
    }
    await refrescarCacheSesion();
    mostrarAlerta('✓ Cuenta creada. Entrando...', 'success');
    window.location.href = '/index';
    return;
  }

  emailPendiente = email;
  nombrePendiente = nombre;
  passPendiente = pass;
  irAPantallaCodigo(email);
  arrancarCooldown(60);
}

// ─── PANTALLA DE CÓDIGO ────────────────────────────────────────────
function irAPantallaCodigo(email){
  document.getElementById('codigoEmailTxt').textContent = email;
  if(!document.querySelector('.codigo-box')) armarCajitas(CANT_DIGITOS);
  limpiarCodigo();
  cambiarTab('codigo');
  setTimeout(() => document.querySelector('.codigo-box').focus(), 250);
}

function volverDelCodigo(){
  clearInterval(cooldownTimer);
  cambiarTab('registro');
}

// ─── Las cajitas se arman solas y se adaptan al largo del código ──
let CANT_DIGITOS = 6;
try {
  const guardado = parseInt(localStorage.getItem('cmm_largo_codigo'));
  if(guardado >= 4 && guardado <= 10) CANT_DIGITOS = guardado;
} catch(e){}

function armarCajitas(cantidad){
  CANT_DIGITOS = cantidad;
  try { localStorage.setItem('cmm_largo_codigo', String(cantidad)); } catch(e){}

  const cont = document.getElementById('codigoInputs');
  cont.innerHTML = '';
  for(let i = 0; i < cantidad; i++){
    const inp = document.createElement('input');
    inp.className = 'codigo-box';
    inp.type = 'text';
    inp.inputMode = 'numeric';
    inp.maxLength = 1;
    inp.dataset.i = i;
    cont.appendChild(inp);
  }
  // Con muchos dígitos, achicamos para que entren en el celular
  cont.style.gap = cantidad > 6 ? '5px' : '8px';
  document.querySelectorAll('.codigo-box').forEach(b => {
    if(cantidad > 6){ b.style.width = '38px'; b.style.fontSize = '20px'; }
  });

  conectarCajitas();
}

function limpiarCodigo(){
  document.querySelectorAll('.codigo-box').forEach(b => {
    b.value = '';
    b.classList.remove('lleno');
  });
}

function leerCodigo(){
  return [...document.querySelectorAll('.codigo-box')].map(b => b.value).join('');
}

function conectarCajitas(){
  const todas = document.querySelectorAll('.codigo-box');

  todas.forEach((box, idx) => {
    box.addEventListener('input', e => {
      const v = e.target.value.replace(/\D/g, '');
      e.target.value = v.slice(-1);
      e.target.classList.toggle('lleno', !!e.target.value);
      if(e.target.value && idx < todas.length - 1) todas[idx + 1].focus();
      if(leerCodigo().length === CANT_DIGITOS) verificarCodigo();
    });

    box.addEventListener('keydown', e => {
      if(e.key === 'Backspace' && !e.target.value && idx > 0){
        todas[idx - 1].focus();
        todas[idx - 1].value = '';
        todas[idx - 1].classList.remove('lleno');
      }
      if(e.key === 'ArrowLeft' && idx > 0) todas[idx - 1].focus();
      if(e.key === 'ArrowRight' && idx < todas.length - 1) todas[idx + 1].focus();
    });

    box.addEventListener('paste', e => {
      e.preventDefault();
      const texto = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');

      // Si el código pegado es más largo, agrandamos las cajitas
      if(texto.length > CANT_DIGITOS && texto.length <= 10){
        armarCajitas(texto.length);
      }

      const nuevas = document.querySelectorAll('.codigo-box');
      texto.slice(0, nuevas.length).split('').forEach((d, i) => {
        nuevas[i].value = d;
        nuevas[i].classList.add('lleno');
      });

      if(texto.length >= CANT_DIGITOS) verificarCodigo();
      else if(nuevas[texto.length]) nuevas[texto.length].focus();
    });
  });
}

async function verificarCodigo(){
  const codigo = leerCodigo();
  if(codigo.length !== CANT_DIGITOS){
    return mostrarAlerta('Completá los ' + CANT_DIGITOS + ' dígitos');
  }

  ocultarAlerta();
  cargando('btnVerificar', 'VERIFICANDO');

  // Probamos los dos tipos que usa Supabase para confirmar registro
  let resultado = await sb.auth.verifyOtp({ email: emailPendiente, token: codigo, type: 'signup' });
  if(resultado.error){
    resultado = await sb.auth.verifyOtp({ email: emailPendiente, token: codigo, type: 'email' });
  }

  if(resultado.error){
    // Puede pasar que la cuenta YA esté confirmada (por ejemplo, si antes
    // clickeaste un enlace de confirmación). En ese caso simplemente entramos.
    if(passPendiente){
      const intento = await sb.auth.signInWithPassword({ email: emailPendiente, password: passPendiente });
      if(!intento.error && intento.data?.session){
        if(nombrePendiente && intento.data.user){
          await sb.from('perfiles').upsert({
            id: intento.data.user.id,
            email: emailPendiente,
            nombre: nombrePendiente,
            rol: 'alumna'
          }, { onConflict: 'id' });
        }
        await refrescarCacheSesion();
        mostrarAlerta('✓ Tu cuenta ya estaba confirmada. Entrando...', 'success');
        setTimeout(() => { window.location.href = '/index'; }, 700);
        return;
      }
    }

    listo('btnVerificar');
    limpiarCodigo();
    document.querySelector('.codigo-box').focus();

    const m = (resultado.error.message || '').toLowerCase();
    if(m.includes('expired') || m.includes('invalid')){
      return mostrarAlerta(
        'Ese código no sirve. Puede ser que esté vencido o que hayas copiado uno de un email anterior. ' +
        'Usá siempre el último correo que te llegó, o tocá "Reenviar código".',
        'error'
      );
    }
    return mostrarAlerta(traducirError(resultado.error.message));
  }

  // Guardamos el nombre en el perfil
  if(nombrePendiente && resultado.data?.user){
    await sb.from('perfiles').update({ nombre: nombrePendiente }).eq('id', resultado.data.user.id);
  }

  await refrescarCacheSesion();
  mostrarAlerta('✓ ¡Email verificado! Entrando...', 'success');
  setTimeout(() => { window.location.href = '/index'; }, 700);
}

function cambiarLargoCodigo(){
  const v = prompt('¿Cuántos dígitos tiene el código que te llegó?', String(CANT_DIGITOS));
  const n = parseInt(v);
  if(!n || n < 4 || n > 10) return;
  armarCajitas(n);
  document.querySelector('.codigo-box').focus();
}

// ─── REENVÍO ───────────────────────────────────────────────────────
function arrancarCooldown(segundos){
  cooldownReenvio = segundos;
  const btn = document.getElementById('btnReenviar');
  clearInterval(cooldownTimer);
  cooldownTimer = setInterval(() => {
    cooldownReenvio--;
    if(cooldownReenvio <= 0){
      clearInterval(cooldownTimer);
      btn.disabled = false;
      btn.textContent = 'Reenviar código';
    } else {
      btn.disabled = true;
      btn.textContent = 'Reenviar en ' + cooldownReenvio + 's';
    }
  }, 1000);
  btn.disabled = true;
  btn.textContent = 'Reenviar en ' + cooldownReenvio + 's';
}

async function enviarCodigoDeNuevo(silencioso){
  const { error } = await sb.auth.resend({ type: 'signup', email: emailPendiente });
  if(error && !silencioso) mostrarAlerta(traducirError(error.message));
  return !error;
}

async function reenviarCodigo(){
  if(cooldownReenvio > 0) return;
  ocultarAlerta();
  const ok = await enviarCodigoDeNuevo(false);
  if(ok){
    mostrarAlerta('✓ Código nuevo enviado a ' + emailPendiente + '. Usá este, el anterior ya no sirve.', 'success');
    limpiarCodigo();
    document.querySelector('.codigo-box').focus();
    arrancarCooldown(60);
  }
}

// ─── RECUPERAR CONTRASEÑA ──────────────────────────────────────────
async function recuperarContrasena(){
  ocultarAlerta();
  const email = document.getElementById('loginEmail').value.trim();
  if(!email) return mostrarAlerta('Escribí tu email arriba y volvé a tocar acá');

  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/recuperar'
  });

  if(error) return mostrarAlerta(traducirError(error.message));
  mostrarAlerta('✓ Te mandamos un email a ' + email + ' con el enlace para cambiar tu contraseña. Revisá también spam.', 'success');
}

// Medidor de fuerza en el registro
if(typeof crearMedidorPassword === 'function'){
  crearMedidorPassword('medidorReg', 'regPass');
}

// ─── Si ya está logueada, la sacamos de acá ────────────────────────
let yaRedirigi = false;
const waitSupaLogin = setInterval(async () => {
  if(typeof sb === 'undefined' || sb === null) return;
  clearInterval(waitSupaLogin);
  try {
    const { data: { user }, error } = await sb.auth.getUser();
    if(user && !yaRedirigi){
      yaRedirigi = true;
      window.location.replace('/index');
    }
  } catch(e){
    // Si la sesión guardada está rota, la limpiamos y dejamos entrar de nuevo
    await sb.auth.signOut();
  }
}, 50);
</script>

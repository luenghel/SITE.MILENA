// milenacmm.com/c/mi-pagina   (o  /captura?p=mi-pagina)

const limpiar = t => { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; };

function cabeceras(){ return { apikey: CAP_KEY, Authorization: 'Bearer ' + CAP_KEY, 'Content-Type': 'application/json' }; }

// ─── Fechas ───
function fechaLarga(d){
  const t = d.toLocaleDateString('es-PY', { weekday: 'long', day: 'numeric', month: 'long' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function horaCorta(d){ return d.toLocaleTimeString('es-PY', { hour: '2-digit', minute: '2-digit', hour12: false }) + ' h'; }

// ─── El formulario (el mismo en los dos diseños) ───

// ═══ DISEÑO A ═══════════════════════════════════════════════════════

// ─── La hoja (diseño B) ───
function abrirHoja(){
  document.getElementById('hoja').classList.add('ver');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.querySelector('#hojaForm input[name=nombre]')?.focus(), 120);
}
function cerrarHoja(){
  document.getElementById('hoja').classList.remove('ver');
  document.body.style.overflow = '';
}
function irAlFormulario(){
  if(PAG && PAG.plantilla === 'b') return abrirHoja();
  const f = document.getElementById('formulario');
  if(f){ f.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => f.querySelector('input')?.focus({ preventScroll: true }), 450); }
}

// ─── La cuenta regresiva ───
function arrancarReloj(){
  if(!PAG.fecha_evento) return;
  const fin = new Date(PAG.fecha_evento).getTime();
  const dos = n => String(n).padStart(2, '0');
  function tic(){
    const ms = Math.max(0, fin - Date.now());
    const d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000),
          m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000);
    document.querySelectorAll('[data-reloj]').forEach(r => {
      r.querySelector('[data-d]').textContent = dos(d); r.querySelector('[data-h]').textContent = dos(h);
      r.querySelector('[data-m]').textContent = dos(m); r.querySelector('[data-s]').textContent = dos(s);
    });
    const fr = document.querySelector('[data-franja]');
    if(fr) fr.textContent = (d ? d + ' d ' : '') + dos(h) + ' h ' + dos(m) + ' m ' + dos(s) + ' s';
  }
  tic();
  setInterval(tic, 1000);
}

// ─── De dónde vino (para saber qué anuncio trae registros) ───
function deDonde(){
  let campana = '';
  try{
    const p = new URLSearchParams(location.search);
    if(p.get('utm_source') || p.get('utm_campaign')) campana = [p.get('utm_source'), p.get('utm_medium'), p.get('utm_campaign')].filter(Boolean).join(' · ');
    else if(p.get('fbclid')) campana = 'facebook · anuncio';
    else if(p.get('gclid')) campana = 'google · anuncio';
    else if(p.get('ttclid')) campana = 'tiktok · anuncio';
    if(campana) sessionStorage.setItem('cmm_campana', campana.slice(0, 120));
    else campana = sessionStorage.getItem('cmm_campana') || '';
  }catch(e){}

  let ref = document.referrer || '';
  if(!ref || /milenacmm\.com/i.test(ref)){
    const a = navigator.userAgent || '';
    if(/Instagram/i.test(a)) ref = 'instagram-app';
    else if(/FBAN|FBAV|FB_IAB/i.test(a)) ref = 'facebook-app';
    else if(/musical_ly|TikTok|BytedanceWebview/i.test(a)) ref = 'tiktok-app';
  }

  const a = navigator.userAgent || '';
  const disp = /iPad|Tablet/i.test(a) ? 'tablet' : /Mobi|Android|iPhone/i.test(a) ? 'celular' : 'computadora';

  let vis = '';
  try{ vis = localStorage.getItem('cmm_visitante') || ''; }catch(e){}
  return { campana, referencia: ref, dispositivo: disp, visitante: vis };
}

// ─── Registrarse ───
async function registrar(ev, form){
  ev.preventDefault();
  if(enviando) return false;

  const err = form.querySelector('.error');
  const btn = form.querySelector('button[type=submit]');
  const ver = m => { err.textContent = m; err.classList.add('ver'); };
  err.classList.remove('ver');

  const nombre = form.nombre.value.trim();
  const email = form.email.value.trim().toLowerCase();
  const whatsapp = form.whatsapp ? form.whatsapp.value.trim() : '';

  if(form.sitio.value) return false;                         // un robot llenó el campo escondido
  if(nombre.length < 2){ ver('Poné tu nombre'); form.nombre.focus(); return false; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ ver('Revisá tu email: parece que falta algo'); form.email.focus(); return false; }
  if(PAG.pedir_whatsapp && whatsapp.replace(/\D/g, '').length < 7){ ver('Poné tu WhatsApp, así te avisamos cuando empiece'); form.whatsapp.focus(); return false; }

  enviando = true;
  btn.disabled = true;
  const txt = btn.querySelector('span');
  const antes = txt.textContent;
  txt.textContent = 'RESERVANDO…';

  try{
    const r = await fetch(CAP_URL + '/rest/v1/rpc/guardar_lead', {
      method: 'POST', headers: cabeceras(),
      body: JSON.stringify({ p_datos: Object.assign({ pagina: CAP_SLUG, nombre, email, whatsapp }, deDonde()) })
    });
    const d = await r.json().catch(() => null);
    if(!r.ok || !d || !d.exito) throw new Error((d && d.error) || 'No pudimos guardar tu registro. Probá de nuevo.');

    // Para los anuncios de Meta y para nuestras métricas
    try{ if(typeof pixelPersona === 'function') pixelPersona(email, nombre); }catch(e){}
    try{ if(typeof pixel === 'function') pixel('Lead', { content_name: CAP_SLUG, content_category: 'captura' }); }catch(e){}
    try{ if(typeof anotarEvento === 'function') anotarEvento('clic', { detalle: 'Se registró', referencia: '' }); }catch(e){}

    mostrarGracias(nombre, d.grupo || PAG.grupo_whatsapp || '');
  }catch(e){
    ver(e.message || 'No pudimos guardar tu registro. Probá de nuevo.');
    btn.disabled = false;
    txt.textContent = antes;
  }
  enviando = false;
  return false;
}

function mostrarGracias(nombre, grupo){
  cerrarHoja();
  const n = nombre.split(/\s+/)[0];
  document.getElementById('graciasTit').innerHTML =
    conMarcas(String(PAG.gracias_titulo || '¡Listo, **{nombre}**!').replace(/\{nombre\}/g, n));
  document.getElementById('graciasTxt').textContent = PAG.gracias_texto || '';

  const a = document.getElementById('graciasGrupo');
  const conGrupo = /^https:\/\//.test(grupo);
  if(conGrupo){ a.href = grupo; a.hidden = false; }
  else { a.hidden = true; }
  document.getElementById('graciasPie').hidden = !conGrupo;

  document.getElementById('pegado').classList.remove('ver');
  document.getElementById('gracias').classList.add('ver');
  document.body.style.overflow = 'hidden';
  window.scrollTo(0, 0);
}

function noEsta(){
  document.body.className = 'tpl-a';
  document.getElementById('cargando').outerHTML =
    '<div class="cargando" style="flex-direction:column;gap:18px;letter-spacing:0;font-size:16px;color:rgba(255,245,240,.75);text-align:center;padding:24px">' +
    '<div class="serif" style="font-size:34px;color:#FFF5F0">Esta página ya no está abierta</div>' +
    '<a href="/" style="color:#FAC775">Ir a milenacmm.com →</a></div>';
}

// ═══ ARRANCAR ═══════════════════════════════════════════════════════
(async function(){
  if(!CAP_SLUG) return noEsta();
  try{
    const r = await fetch(CAP_URL + '/rest/v1/paginas_captura?slug=eq.' + encodeURIComponent(CAP_SLUG) + '&activa=eq.true&select=*&limit=1',
      { headers: cabeceras() });
    const filas = r.ok ? await r.json() : [];
    PAG = filas && filas[0];
  }catch(e){ PAG = null; }

  if(!PAG) return noEsta();

  document.body.className = PAG.plantilla === 'b' ? 'tpl-b' : 'tpl-a';
  document.title = String(PAG.titulo || '').replace(/\*\*/g, '') + ' · Milena Machado';
  if(PAG.plantilla === 'b') document.querySelector('meta[name=theme-color]').setAttribute('content', '#4A0F1E');

  const cont = document.getElementById('pagina');
  cont.innerHTML = PAG.plantilla === 'b' ? pintarB() : pintarA();
  document.getElementById('hojaForm').innerHTML = PAG.plantilla === 'b' ? htmlFormulario() : '';
  document.getElementById('pegadoTxt').textContent = PAG.boton || 'QUIERO MI LUGAR GRATIS';
  document.getElementById('cargando').remove();
  cont.hidden = false;

  arrancarReloj();

  // El botón de abajo aparece cuando el formulario (o el botón principal) deja de verse
  const ancla = document.getElementById('formulario') || document.querySelector('.b-hero .boton');
  if(ancla && 'IntersectionObserver' in window){
    new IntersectionObserver(es => {
      const abierto = document.getElementById('gracias').classList.contains('ver');
      document.getElementById('pegado').classList.toggle('ver', !es[0].isIntersecting && !abierto);
    }, { threshold: 0.05 }).observe(ancla);
  }

  document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrarHoja(); });
})();
</script>

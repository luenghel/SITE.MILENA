<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clase · Milena Machado</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1A0A12">
<link rel="stylesheet" href="styles.css">
<style>
  body{background:#0E0509}

  /* ── Barra de arriba ── */
  .clase-top{position:sticky;top:0;z-index:60;background:rgba(14,5,9,0.97);backdrop-filter:blur(20px);border-bottom:0.5px solid rgba(255,245,240,0.08);padding:12px 24px;display:flex;align-items:center;gap:14px}
  .volver-curso{display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(255,245,240,0.7);text-decoration:none;padding:8px 12px;border-radius:9px;transition:all 0.2s;white-space:nowrap}
  .volver-curso:hover{background:rgba(255,245,240,0.06);color:#FFF5F0}
  .top-curso{flex:1;min-width:0}
  .top-curso-nom{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top-curso-prog{font-size:11px;color:rgba(255,245,240,0.5);margin-top:2px}
  .btn-lista{display:none;padding:9px 13px;background:rgba(255,245,240,0.06);border:0.5px solid rgba(255,245,240,0.16);border-radius:9px;color:#FFF5F0;font-size:12px;cursor:pointer;font-family:inherit;align-items:center;gap:7px}

  /* ── Distribución ── */
  .clase-layout{display:grid;grid-template-columns:1fr 340px;gap:0;min-height:calc(100vh - 57px)}
  .clase-main{padding:0 0 60px;min-width:0}
  .clase-lista{border-left:0.5px solid rgba(255,245,240,0.08);background:rgba(255,245,240,0.015);overflow-y:auto;max-height:calc(100vh - 57px);position:sticky;top:57px}

  /* ── Video ── */
  .video-caja{background:#000;aspect-ratio:16/9;width:100%;position:relative}
  .video-caja iframe,.video-caja video{width:100%;height:100%;border:0;display:block}
  .video-sin{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#2D0A18,#1A0509);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:rgba(255,245,240,0.5);text-align:center;padding:20px}

  /* ── Contenido de la clase ── */
  .clase-cuerpo{padding:26px 32px;max-width:820px}
  .clase-meta{display:flex;align-items:center;gap:9px;font-size:11px;color:rgba(255,245,240,0.5);margin-bottom:10px;flex-wrap:wrap}
  .clase-modulo{padding:4px 10px;background:rgba(212,163,86,0.14);border:0.5px solid rgba(212,163,86,0.35);border-radius:14px;color:#FAC775;font-size:10px;letter-spacing:0.08em;font-weight:600}
  .clase-h1{font-size:27px;font-weight:500;font-family:Georgia,serif;letter-spacing:-0.015em;margin:0 0 12px;line-height:1.2}
  .clase-desc{font-size:14.5px;color:rgba(255,245,240,0.75);line-height:1.65;margin-bottom:24px;white-space:pre-wrap}
  .clase-texto{font-size:15px;color:rgba(255,245,240,0.88);line-height:1.75;margin-bottom:26px;white-space:pre-wrap}

  .clase-acciones{display:flex;gap:10px;flex-wrap:wrap;padding-top:22px;border-top:0.5px solid rgba(255,245,240,0.07)}
  .btn-completar{padding:14px 26px;border-radius:12px;border:none;font-size:12px;font-weight:600;letter-spacing:0.1em;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:9px;background:linear-gradient(135deg,#FAC775,#D4A356);color:#3D1208;transition:all 0.25s}
  .btn-completar.hecha{background:rgba(93,202,165,0.16);border:0.5px solid rgba(93,202,165,0.5);color:#9FE1CB}
  .btn-nav{padding:14px 20px;border-radius:12px;background:rgba(255,245,240,0.05);border:0.5px solid rgba(255,245,240,0.16);color:#FFF5F0;font-size:12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:all 0.2s}
  .btn-nav:hover{background:rgba(255,245,240,0.1)}
  .btn-nav.principal{background:linear-gradient(135deg,rgba(212,163,86,0.2),rgba(212,163,86,0.06));border-color:rgba(212,163,86,0.5);color:#FAC775}

  /* ── Materiales ── */
  .materiales{margin-top:26px;padding-top:22px;border-top:0.5px solid rgba(255,245,240,0.07)}
  .mat-titulo{font-size:11px;letter-spacing:0.18em;color:rgba(255,245,240,0.5);font-weight:600;margin-bottom:12px}
  .mat-item{display:flex;align-items:center;gap:12px;padding:13px 15px;background:rgba(255,245,240,0.04);border:0.5px solid rgba(255,245,240,0.1);border-radius:11px;margin-bottom:8px;text-decoration:none;color:inherit;transition:all 0.2s}
  .mat-item:hover{background:rgba(255,245,240,0.08);border-color:rgba(212,163,86,0.4)}
  .mat-ico{width:36px;height:36px;border-radius:9px;background:rgba(212,163,86,0.14);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
  .mat-nom{font-size:13.5px;font-weight:500}
  .mat-sub{font-size:11.5px;color:rgba(255,245,240,0.5);margin-top:1px}

  /* ── Lista lateral ── */
  .lista-head{padding:18px 20px 14px;border-bottom:0.5px solid rgba(255,245,240,0.07);position:sticky;top:0;background:rgba(14,5,9,0.97);backdrop-filter:blur(12px);z-index:5}
  .lista-titulo{font-size:14px;font-weight:500;margin-bottom:10px}
  .barra-prog{height:5px;background:rgba(255,245,240,0.1);border-radius:3px;overflow:hidden}
  .barra-prog-fill{height:100%;background:linear-gradient(90deg,#D4A356,#FAC775);border-radius:3px;transition:width 0.5s cubic-bezier(0.34,1.2,0.64,1)}
  .lista-prog-txt{font-size:11.5px;color:rgba(255,245,240,0.55);margin-top:7px}

  .mod-grupo{border-bottom:0.5px solid rgba(255,245,240,0.05)}
  .mod-cab{padding:14px 20px 10px;display:flex;align-items:center;gap:10px}
  .mod-cab-num{width:24px;height:24px;border-radius:7px;background:rgba(212,163,86,0.14);border:0.5px solid rgba(212,163,86,0.35);color:#FAC775;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mod-cab-tit{font-size:12.5px;font-weight:500;flex:1;min-width:0}
  .mod-cab-meta{font-size:10.5px;color:rgba(255,245,240,0.4)}

  .cl-item{display:flex;align-items:center;gap:11px;padding:11px 20px;cursor:pointer;transition:background 0.18s;border-left:2.5px solid transparent}
  .cl-item:hover{background:rgba(255,245,240,0.04)}
  .cl-item.activa{background:rgba(212,163,86,0.1);border-left-color:#FAC775}
  .cl-item.bloqueada{opacity:0.45;cursor:not-allowed}
  .cl-estado{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,245,240,0.22);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px}
  .cl-estado.hecha{background:rgba(93,202,165,0.2);border-color:#5DCAA5}
  .cl-item.activa .cl-estado{border-color:#FAC775}
  .cl-txt{flex:1;min-width:0}
  .cl-nom{font-size:12.5px;line-height:1.3}
  .cl-item.activa .cl-nom{color:#FAC775}
  .cl-min{font-size:10.5px;color:rgba(255,245,240,0.4);margin-top:2px}
  .cl-muestra{padding:1px 6px;border-radius:4px;font-size:8.5px;font-weight:700;letter-spacing:0.05em;background:rgba(93,202,165,0.18);border:0.5px solid rgba(93,202,165,0.45);color:#9FE1CB;flex-shrink:0}

  /* ── Estados ── */
  .pantalla-msg{max-width:460px;margin:70px auto;text-align:center;padding:0 24px}
  .msg-ico{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,rgba(212,163,86,0.2),rgba(212,163,86,0.05));border:0.5px solid rgba(212,163,86,0.45);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
  .msg-tit{font-size:24px;font-weight:500;font-family:Georgia,serif;margin-bottom:10px}
  .msg-txt{font-size:14px;color:rgba(255,245,240,0.65);line-height:1.6;margin-bottom:26px}

  .cargando{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px}
  .spin{width:38px;height:38px;border:3px solid rgba(212,163,86,0.2);border-top-color:#FAC775;border-radius:50%;animation:girar 0.8s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}

  .toast{position:fixed;bottom:30px;right:30px;background:linear-gradient(135deg,#5DCAA5,#9FE1CB);color:#0E0509;padding:14px 22px;border-radius:11px;font-size:13px;font-weight:500;z-index:9999;display:none;box-shadow:0 12px 32px rgba(93,202,165,0.4)}
  .toast.show{display:block}
  .toast.error{background:linear-gradient(135deg,#FF8090,#C8203A);color:#FFF5F0}

  /* ── Celular ── */
  @media (max-width:1000px){
    .clase-layout{grid-template-columns:1fr}
    .clase-lista{position:fixed;top:0;right:-100%;bottom:0;width:320px;max-width:86vw;z-index:200;background:#12060A;max-height:100vh;transition:right 0.3s cubic-bezier(0.34,1.3,0.64,1);border-left:0.5px solid rgba(212,163,86,0.25)}
    .clase-lista.abierta{right:0}
    .btn-lista{display:inline-flex}
    .lista-fondo{position:fixed;inset:0;background:rgba(8,3,6,0.75);z-index:199;opacity:0;pointer-events:none;transition:opacity 0.25s}
    .lista-fondo.show{opacity:1;pointer-events:auto}
    .clase-top{padding:12px 16px}
    .clase-cuerpo{padding:20px 16px}
    .clase-h1{font-size:21px}
    .clase-acciones{flex-direction:column}
    .clase-acciones>*{width:100%;justify-content:center}
    .toast{left:16px;right:16px;bottom:16px;text-align:center}
  }
</style>

.auth-splash-spinner{width:40px;height:40px;border:2px solid rgba(212,163,86,0.2);border-top-color:#FAC775;border-radius:50%;animation:girar 0.8s linear infinite}
</style>

<script>
// ═══════════════════════════════════════════════════════════════════
// REPRODUCTOR DE CLASES
// ═══════════════════════════════════════════════════════════════════

const params = new URLSearchParams(window.location.search);
const cursoSlug = params.get('curso');
let claseActualId = params.get('clase');

let usuario = null;
let curso = null;
let modulos = [];
let clases = [];
let clasesPlanas = [];
let progreso = {};
let tieneAcceso = false;
let claseActual = null;
let compraActual = null;

const ICO_TIPO = { video: '🎬', pdf: '📄', texto: '📝', enlace: '🔗', audio: '🎧' };

// ¿Esta clase ya se liberó para esta alumna?
function estadoLiberacion(cl){
  if(typeof claseDisponible !== 'function') return { libre: true, dias: 0, fecha: null };
  return claseDisponible(cl, curso || {}, compraActual, clases, modulos);
}

function esc(t){
  if(!t) return '';
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function mostrarToast(msg, err){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.toggle('error', !!err);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function verPantalla(id){
  ['cargando','contenido','sinAcceso','noExiste'].forEach(x => {
    const el = document.getElementById(x);
    if(el) el.style.display = (x === id) ? (x === 'contenido' ? 'block' : 'block') : 'none';
  });
}

// ─── Reconocer el video ────────────────────────────────────────────
function analizarVideo(url){
  if(!url) return null;
  const u = url.trim();

  let m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([A-Za-z0-9_-]{11})/);
  if(m) return { tipo: 'iframe', src: 'https://www.youtube.com/embed/' + m[1] + '?rel=0&modestbranding=1&color=white' };

  m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return { tipo: 'iframe', src: 'https://player.vimeo.com/video/' + m[1] };

  if(/\.(mp4|webm|mov)(\?|$)/i.test(u)) return { tipo: 'archivo', src: u };

  return null;
}

// ─── Pintar el video / contenido principal ─────────────────────────
function pintarVideo(cl){
  const zona = document.getElementById('zonaVideo');

  if(cl.tipo === 'video' && cl.video_url){
    const v = analizarVideo(cl.video_url);
    if(v && v.tipo === 'iframe'){
      zona.innerHTML = '<div class="video-caja"><iframe src="' + esc(v.src) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
      return;
    }
    if(v && v.tipo === 'archivo'){
      zona.innerHTML = '<div class="video-caja"><video src="' + esc(v.src) + '" controls playsinline></video></div>';
      return;
    }
  }

  if(cl.tipo === 'video'){
    zona.innerHTML = '<div class="video-sin">' +
      '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="rgba(255,245,240,0.35)" stroke-width="1.5"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>' +
      '<div style="font-size:14px">Esta clase todavía no tiene video cargado</div></div>';
    return;
  }

  if(cl.tipo === 'pdf' && cl.archivo_url){
    zona.innerHTML = '<div class="video-sin" style="aspect-ratio:auto;padding:40px 20px">' +
      '<div style="font-size:44px">📄</div>' +
      '<div style="font-size:15px;color:rgba(255,245,240,0.8)">Material para descargar</div>' +
      '<a href="' + esc(cl.archivo_url) + '" target="_blank" rel="noopener" class="cta-gold" style="display:inline-block;padding:14px 28px;border-radius:11px;font-size:12px;font-weight:600;letter-spacing:0.1em;text-decoration:none;margin-top:6px">ABRIR EL MATERIAL</a></div>';
    return;
  }

  if(cl.tipo === 'enlace' && cl.video_url){
    zona.innerHTML = '<div class="video-sin" style="aspect-ratio:auto;padding:40px 20px">' +
      '<div style="font-size:44px">🔗</div>' +
      '<div style="font-size:15px;color:rgba(255,245,240,0.8)">Contenido externo</div>' +
      '<a href="' + esc(cl.video_url) + '" target="_blank" rel="noopener" class="cta-gold" style="display:inline-block;padding:14px 28px;border-radius:11px;font-size:12px;font-weight:600;letter-spacing:0.1em;text-decoration:none;margin-top:6px">ABRIR</a></div>';
    return;
  }

  zona.innerHTML = '';
}

// ─── Pintar la clase completa ──────────────────────────────────────
async function abrirClase(id, empujarHistorial){
  const cl = clasesPlanas.find(x => x.id === id);
  if(!cl) return;

  claseActual = cl;
  claseActualId = id;

  // ¿Ya se liberó?
  const lib = estadoLiberacion(cl);
  if(!lib.libre && !cl.gratis){
    document.getElementById('sinAccesoTit').textContent = 'Todavía no está disponible';
    document.getElementById('sinAccesoTxt').textContent =
      '"' + cl.titulo + '" ' + textoEspera(lib).toLowerCase() + '. Te vamos a avisar por email cuando puedas verla.';
    verPantalla('sinAcceso');
    return;
  }

  // ¿Puede verla?
  if(!tieneAcceso && !cl.gratis){
    document.getElementById('sinAccesoTit').textContent = 'Esta clase es para alumnas';
    document.getElementById('sinAccesoTxt').textContent =
      'Conseguí "' + (curso?.titulo || 'el curso') + '" y accedé a todo el contenido.';
    verPantalla('sinAcceso');
    return;
  }

  verPantalla('contenido');

  const mod = modulos.find(m => m.id === cl.modulo_id);
  document.getElementById('claseMeta').innerHTML =
    (mod ? '<span class="clase-modulo">' + esc(mod.titulo) + '</span>' : '') +
    (cl.duracion_minutos ? '<span>' + cl.duracion_minutos + ' min</span>' : '') +
    (cl.gratis && !tieneAcceso ? '<span class="cl-muestra">CLASE DE MUESTRA</span>' : '');

  document.getElementById('claseTitulo').textContent = cl.titulo;

  const desc = document.getElementById('claseDesc');
  desc.textContent = cl.descripcion || '';
  desc.style.display = cl.descripcion ? 'block' : 'none';

  const txt = document.getElementById('claseTexto');
  if(cl.tipo === 'texto' && cl.contenido){
    txt.textContent = cl.contenido;
    txt.style.display = 'block';
  } else {
    txt.style.display = 'none';
  }

  pintarVideo(cl);
  await cargarMateriales(cl.id);
  pintarBotonCompletar();
  pintarNavegacion();
  renderLista();
  cerrarLista();

  if(empujarHistorial){
    const url = '/clase?curso=' + encodeURIComponent(cursoSlug) + '&clase=' + encodeURIComponent(id);
    history.pushState({ clase: id }, '', url);
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── Materiales ────────────────────────────────────────────────────
async function cargarMateriales(claseId){
  const zona = document.getElementById('zonaMateriales');
  const lista = document.getElementById('listaMateriales');

  const { data } = await sb.from('materiales').select('*').eq('clase_id', claseId).order('orden', { ascending: true });
  const mats = data || [];

  // Si la clase es un video pero tiene archivo, lo sumamos
  if(claseActual?.archivo_url && claseActual.tipo !== 'pdf'){
    mats.unshift({ id: 'propio', titulo: 'Material de la clase', tipo: 'pdf', url: claseActual.archivo_url });
  }

  if(mats.length === 0){ zona.style.display = 'none'; return; }

  zona.style.display = 'block';
  lista.innerHTML = mats.map(m => {
    const ico = m.tipo === 'enlace' ? '🔗' : (m.tipo === 'imagen' ? '🖼️' : '📄');
    return '<a href="' + esc(m.url) + '" target="_blank" rel="noopener" class="mat-item">' +
      '<div class="mat-ico">' + ico + '</div>' +
      '<div style="flex:1;min-width:0"><div class="mat-nom">' + esc(m.titulo) + '</div>' +
      '<div class="mat-sub">' + (m.tipo === 'enlace' ? 'Abrir enlace' : 'Descargar') + '</div></div>' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,245,240,0.4)" stroke-width="1.8" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
      '</a>';
  }).join('');
}

// ─── Marcar como vista ─────────────────────────────────────────────
function pintarBotonCompletar(){
  const hecha = !!progreso[claseActualId];
  const btn = document.getElementById('btnCompletar');
  btn.classList.toggle('hecha', hecha);
  document.getElementById('btnCompletarTxt').textContent = hecha ? 'CLASE VISTA' : 'MARCAR COMO VISTA';
}

async function alternarCompletada(){
  if(!usuario) return mostrarToast('Entrá para guardar tu avance', true);

  const hecha = !!progreso[claseActualId];
  const nuevo = !hecha;

  progreso[claseActualId] = nuevo;
  pintarBotonCompletar();
  pintarProgreso();
  renderLista();

  const { error } = await sb.from('progreso').upsert({
    usuario_id: usuario.id,
    clase_id: claseActualId,
    curso_id: curso.id,
    completada: nuevo,
    actualizado_en: new Date().toISOString()
  }, { onConflict: 'usuario_id,clase_id' });

  if(error){
    progreso[claseActualId] = hecha;
    pintarBotonCompletar();
    pintarProgreso();
    renderLista();
    return mostrarToast('No pudimos guardar tu avance', true);
  }

  if(nuevo){
    const idx = clasesPlanas.findIndex(x => x.id === claseActualId);
    const sig = clasesPlanas[idx + 1];
    if(sig) mostrarToast('✓ Clase completada');
    else mostrarToast('🎉 ¡Terminaste el curso!');
  }
}

// ─── Navegación ────────────────────────────────────────────────────
function pintarNavegacion(){
  const idx = clasesPlanas.findIndex(x => x.id === claseActualId);
  const ant = clasesPlanas[idx - 1];
  const sig = clasesPlanas[idx + 1];
  document.getElementById('btnAnterior').style.display = ant ? '' : 'none';
  document.getElementById('btnSiguiente').style.display = sig ? '' : 'none';
}

function irAnterior(){
  const idx = clasesPlanas.findIndex(x => x.id === claseActualId);
  const ant = clasesPlanas[idx - 1];
  if(ant) abrirClase(ant.id, true);
}

function irSiguiente(){
  const idx = clasesPlanas.findIndex(x => x.id === claseActualId);
  const sig = clasesPlanas[idx + 1];
  if(sig) abrirClase(sig.id, true);
}

// ─── Progreso ──────────────────────────────────────────────────────
function pintarProgreso(){
  const total = clasesPlanas.length;
  const hechas = clasesPlanas.filter(c => progreso[c.id]).length;
  const pct = total ? Math.round((hechas / total) * 100) : 0;

  document.getElementById('barraProg').style.width = pct + '%';
  document.getElementById('listaProgTxt').textContent = hechas + ' de ' + total + ' clases · ' + pct + '%';
  document.getElementById('topProgreso').textContent = pct + '% completado';
}

// ─── Lista lateral ─────────────────────────────────────────────────
function renderLista(){
  const cont = document.getElementById('listaClases');

  cont.innerHTML = modulos.map((m, i) => {
    const cls = clases.filter(c => c.modulo_id === m.id);
    if(cls.length === 0) return '';

    const min = cls.reduce((s, x) => s + (x.duracion_minutos || 0), 0);

    return '<div class="mod-grupo">' +
      '<div class="mod-cab">' +
        '<div class="mod-cab-num">' + (i + 1) + '</div>' +
        '<div class="mod-cab-tit">' + esc(m.titulo) + '</div>' +
        '<div class="mod-cab-meta">' + cls.length + (min ? ' · ' + min + 'm' : '') + '</div>' +
      '</div>' +
      cls.map(cl => {
        const hecha = !!progreso[cl.id];
        const activa = cl.id === claseActualId;
        const lib = estadoLiberacion(cl);
        const porLiberar = !lib.libre && !cl.gratis;
        const bloqueada = (!tieneAcceso && !cl.gratis) || porLiberar;

        return '<div class="cl-item ' + (activa ? 'activa ' : '') + (bloqueada ? 'bloqueada' : '') + '" ' +
          (bloqueada ? '' : 'onclick="abrirClase(&#39;' + cl.id + '&#39;, true)"') + '>' +
          '<div class="cl-estado ' + (hecha ? 'hecha' : '') + '">' +
            (hecha
              ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#5DCAA5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
              : (bloqueada
                  ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(255,245,240,0.5)" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
                  : (ICO_TIPO[cl.tipo] || ''))) +
          '</div>' +
          '<div class="cl-txt">' +
            '<div class="cl-nom">' + esc(cl.titulo) + '</div>' +
            '<div class="cl-min">' + (porLiberar
                ? '🔒 ' + esc(textoEspera(lib))
                : (cl.duracion_minutos ? cl.duracion_minutos + ' min' : (ICO_TIPO[cl.tipo] || ''))) + '</div>' +
          '</div>' +
          (cl.gratis && !tieneAcceso ? '<span class="cl-muestra">MUESTRA</span>' : '') +
        '</div>';
      }).join('') +
    '</div>';
  }).join('');
}

function abrirLista(){
  document.getElementById('listaLateral').classList.add('abierta');
  document.getElementById('listaFondo').classList.add('show');
}
function cerrarLista(){
  document.getElementById('listaLateral').classList.remove('abierta');
  document.getElementById('listaFondo').classList.remove('show');
}

window.addEventListener('popstate', e => {
  const id = e.state?.clase || new URLSearchParams(window.location.search).get('clase');
  if(id) abrirClase(id, false);
});

// ─── Arranque ──────────────────────────────────────────────────────
const esperarSupa = setInterval(async () => {
  if(typeof sb === 'undefined' || sb === null) return;
  clearInterval(esperarSupa);

  document.getElementById('auth-splash-style')?.remove();
  document.getElementById('authSplash')?.remove();

  if(!cursoSlug){ verPantalla('noExiste'); return; }

  const { data: { user } } = await sb.auth.getUser();
  usuario = user;

  // Curso
  const { data: c } = await sb.from('cursos').select('*').eq('slug', cursoSlug).maybeSingle();
  if(!c){ verPantalla('noExiste'); return; }
  curso = c;

  document.getElementById('topCurso').textContent = c.titulo;
  document.getElementById('listaTitulo').textContent = c.titulo;
  document.getElementById('linkVolver').href = '/curso-detalle?id=' + encodeURIComponent(cursoSlug);

  // ¿Tiene acceso?
  const acceso = c.acceso || (c.precio_gs ? 'pago' : 'gratis');
  if(acceso === 'gratis'){
    tieneAcceso = true;
  } else if(user){
    const { data: compra } = await sb.from('compras')
      .select('id, pagado_en, creado_en').eq('usuario_id', user.id).eq('curso_id', c.id).eq('estado', 'pagado').maybeSingle();
    tieneAcceso = !!compra;
    if(compra) compraActual = { pagado_en: compra.pagado_en || compra.creado_en };
  }

  // Contenido
  const [rMod, rCla] = await Promise.all([
    sb.from('modulos').select('*').eq('curso_id', c.id).eq('publicado', true).order('orden', { ascending: true }),
    sb.from('clases').select('*').eq('curso_id', c.id).eq('publicado', true).order('orden', { ascending: true })
  ]);

  modulos = rMod.data || [];
  clases = rCla.data || [];

  // Orden real: por módulo y dentro de cada módulo
  clasesPlanas = [];
  modulos.forEach(m => {
    clases.filter(x => x.modulo_id === m.id).forEach(x => clasesPlanas.push(x));
  });

  if(clasesPlanas.length === 0){
    document.getElementById('sinAccesoTit').textContent = 'Este curso todavía no tiene clases';
    document.getElementById('sinAccesoTxt').textContent = 'Estamos preparando el contenido. Volvé pronto.';
    verPantalla('sinAcceso');
    return;
  }

  // Progreso
  if(user){
    const { data: prog } = await sb.from('progreso')
      .select('clase_id, completada').eq('usuario_id', user.id).eq('curso_id', c.id);
    (prog || []).forEach(p => { if(p.completada) progreso[p.clase_id] = true; });
  }

  pintarProgreso();

  // Qué clase abrir: la de la URL, la primera sin ver, o la primera
  const disponibles = clasesPlanas.filter(x => estadoLiberacion(x).libre || x.gratis);

  if(disponibles.length === 0){
    const prox = clasesPlanas[0];
    const lib = prox ? estadoLiberacion(prox) : null;
    document.getElementById('sinAccesoTit').textContent = 'Tu curso todavía no empezó';
    document.getElementById('sinAccesoTxt').textContent = lib
      ? 'La primera clase ' + textoEspera(lib).toLowerCase() + '. Te avisamos por email.'
      : 'Estamos preparando el contenido.';
    verPantalla('sinAcceso');
    return;
  }

  let inicial = claseActualId && disponibles.find(x => x.id === claseActualId)
    ? claseActualId
    : (disponibles.find(x => !progreso[x.id]) || disponibles[0]).id;

  await abrirClase(inicial, false);
}, 40);
</script>

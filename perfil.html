<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A0A12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milena">
<title>Mi perfil · Milena Machado</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Hero del perfil */
  .profile-hero{padding:50px 32px 32px;text-align:center;position:relative;overflow:hidden;max-width:780px;margin:0 auto}
  .profile-glow-1{position:absolute;width:400px;height:400px;left:-100px;top:-100px;border-radius:50%;background:radial-gradient(circle,rgba(232,184,196,0.25),transparent 65%);pointer-events:none}
  .profile-glow-2{position:absolute;width:340px;height:340px;right:-80px;top:-60px;border-radius:50%;background:radial-gradient(circle,rgba(212,163,86,0.22),transparent 70%);pointer-events:none}

  .profile-content{position:relative}
  .profile-avatar-wrap{position:relative;display:inline-block;margin-bottom:18px}
  .profile-avatar{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#B8294A,#E8B8C4);border:2.5px solid rgba(212,163,86,0.6);box-shadow:0 12px 32px rgba(212,163,86,0.25)}
  .rank-badge{position:absolute;right:0;bottom:0;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FAC775,#D4A356);border:3px solid #1A0A12;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(212,163,86,0.4)}

  .profile-name{font-size:32px;font-weight:500;margin:0 0 6px;letter-spacing:-0.02em}
  .profile-level{font-size:11px;letter-spacing:0.18em;color:#FAC775;font-weight:500;margin-bottom:18px}

  .level-bar{max-width:380px;margin:0 auto 6px;height:8px;background:rgba(255,245,240,0.08);border-radius:4px;overflow:hidden}
  .level-fill{width:71%;height:100%;background:linear-gradient(90deg,#B8294A,#FAC775,#D4A356);border-radius:4px;box-shadow:0 0 12px rgba(212,163,86,0.4)}
  .level-progress-text{font-size:11.5px;color:rgba(255,245,240,0.6)}
  .level-progress-text strong{color:#FAC775}

  /* Stats grid */
  .stats-grid{max-width:780px;margin:32px auto;padding:0 32px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .stat-card{padding:18px;background:rgba(255,245,240,0.03);border:0.5px solid rgba(255,245,240,0.08);border-radius:13px;text-align:center;transition:all 0.25s}
  .stat-card:hover{transform:translateY(-2px);border-color:rgba(212,163,86,0.3)}
  .stat-num{font-size:26px;font-weight:500;font-family:Georgia,serif;letter-spacing:-0.02em;margin-bottom:4px}
  .stat-num.gold{color:#FAC775}
  .stat-num.rose{color:#E8B8C4}
  .stat-label{font-size:9.5px;letter-spacing:0.16em;color:rgba(255,245,240,0.55);font-weight:500}

  /* Filtros */
  .insignias-section{max-width:1280px;margin:0 auto;padding:24px 32px 50px}
  .insignias-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:14px}
  .insignias-title{font-size:22px;font-weight:500;font-family:Georgia,serif}
  .insignia-filters{display:flex;gap:6px;flex-wrap:wrap}

  .insignias-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}

  /* Insignia card */
  .insignia{background:rgba(255,245,240,0.03);border:0.5px solid rgba(255,245,240,0.08);border-radius:13px;padding:18px 14px;text-align:center;cursor:pointer;transition:all 0.4s cubic-bezier(0.34,1.4,0.64,1);position:relative;overflow:hidden}
  .insignia:hover{transform:translateY(-3px);border-color:rgba(212,163,86,0.35);box-shadow:0 14px 32px rgba(0,0,0,0.4)}
  .insignia.locked{opacity:0.45}
  .insignia.locked:hover{opacity:0.65}

  .hexagon{width:80px;height:80px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;-webkit-clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);position:relative;font-size:32px}
  .hex-silver{background:linear-gradient(135deg,#E8B8C4,#C97990,#7A1B2E)}
  .hex-gold{background:linear-gradient(135deg,#FAC775,#D4A356,#B88A35);box-shadow:0 0 24px rgba(212,163,86,0.3)}
  .hex-diamond{background:linear-gradient(135deg,#E8B8C4,#FAC775,#9FE1CB,#B8294A);box-shadow:0 0 28px rgba(232,184,196,0.4)}
  .hex-locked{background:rgba(255,245,240,0.06);border:0.5px dashed rgba(255,245,240,0.2)}
  .hex-emerald{background:linear-gradient(135deg,#9FE1CB,#5DCAA5,#1A6B4A)}

  .insignia-name{font-size:13px;font-weight:500;margin-bottom:4px;font-family:Georgia,serif;font-style:italic}
  .insignia-desc{font-size:10.5px;color:rgba(255,245,240,0.55);line-height:1.4;margin-bottom:6px}
  .insignia-rarity{font-size:9px;letter-spacing:0.18em;font-weight:500}
  .rarity-common{color:rgba(255,245,240,0.5)}
  .rarity-rare{color:#E8B8C4}
  .rarity-epic{color:#FAC775}
  .rarity-legendary{background:linear-gradient(95deg,#FAC775,#E8B8C4,#9FE1CB,#FAC775);-webkit-background-clip:text;background-clip:text;color:transparent}

  @media (max-width:768px){
    .profile-hero{padding:30px 16px 24px}
    .profile-name{font-size:26px}
    .stats-grid{grid-template-columns:repeat(2,1fr);padding:0 16px;margin:20px auto}
    .insignias-section{padding:20px 16px 30px}
    .insignias-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .insignia{padding:14px 10px}
    .hexagon{width:64px;height:64px;font-size:24px}
  }

  .profile-avatar{cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-style:italic;font-weight:500;font-size:40px;color:#FFF5F0;background-size:cover;background-position:center;transition:filter 0.2s}
  .profile-avatar:hover{filter:brightness(1.15)}
  .btn-editar-perfil{margin-top:16px;padding:9px 18px;background:rgba(255,245,240,0.06);border:0.5px solid rgba(255,245,240,0.2);border-radius:22px;color:#FFF5F0;font-size:12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:all 0.22s}
  .btn-editar-perfil:hover{background:rgba(255,245,240,0.12);border-color:rgba(212,163,86,0.5)}

  .edit-backdrop{position:fixed;inset:0;background:rgba(14,5,9,0.85);backdrop-filter:blur(10px);z-index:9998;display:none;align-items:center;justify-content:center;padding:20px}
  .edit-backdrop.show{display:flex}
  .edit-modal{background:linear-gradient(180deg,#2D0A18,#1A0509);border:0.5px solid rgba(212,163,86,0.4);border-radius:18px;width:100%;max-width:420px;padding:26px}
  .edit-modal h3{font-family:Georgia,serif;font-size:20px;font-weight:500;margin:0 0 18px}
  .edit-field{margin-bottom:14px}
  .edit-label{font-size:10.5px;letter-spacing:0.16em;color:rgba(255,245,240,0.55);font-weight:600;display:block;margin-bottom:6px}
  .edit-input{width:100%;padding:12px 14px;background:rgba(255,245,240,0.04);border:0.5px solid rgba(255,245,240,0.15);border-radius:9px;color:#FFF5F0;font-size:14px;outline:none;font-family:inherit}
  .edit-input:focus{border-color:rgba(212,163,86,0.5)}
  .edit-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .edit-cancel{padding:10px 18px;background:transparent;border:0.5px solid rgba(255,245,240,0.2);border-radius:9px;color:#FFF5F0;font-size:12px;cursor:pointer;font-family:inherit}
  .edit-save{padding:10px 22px;background:linear-gradient(135deg,#FAC775,#D4A356);border:none;border-radius:9px;color:#3D1208;font-size:12px;font-weight:600;letter-spacing:0.08em;cursor:pointer;font-family:inherit}

  .toast{position:fixed;bottom:30px;right:30px;background:linear-gradient(135deg,#5DCAA5,#9FE1CB);color:#0E0509;padding:14px 22px;border-radius:11px;font-size:13px;font-weight:500;z-index:9999;display:none;box-shadow:0 12px 32px rgba(93,202,165,0.4)}
  .toast.show{display:block}
  .toast.error{background:linear-gradient(135deg,#FF8090,#C8203A);color:#FFF5F0}
  @media (max-width:768px){.toast{left:16px;right:16px;bottom:16px;text-align:center}}

</style>
<style id="auth-splash-style">
body{visibility:hidden}
.auth-splash{position:fixed;inset:0;background:linear-gradient(180deg,#1A0A12 0%,#0E0509 100%);z-index:9999;display:flex;align-items:center;justify-content:center;visibility:visible}
.auth-splash-spinner{width:40px;height:40px;border:2px solid rgba(212,163,86,0.2);border-top-color:#FAC775;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="auth-splash" id="authSplash"><div class="auth-splash-spinner"></div></div>

<header class="main-header">
  <div class="header-inner">
    <a href="/index" class="logo">
      <div class="logo-box">M</div>
      <div class="logo-text">MILENA<br>MACHADO</div>
    </a>
    <a href="/index" class="nav-btn">INICIO</a>
    <a href="/cursos" class="nav-btn">CURSOS</a>
    <a href="/blog" class="nav-btn">BLOG</a>

  </div>
</header>

<!-- Hero del perfil -->
<section class="profile-hero">
  <div class="profile-glow-1"></div>
  <div class="profile-glow-2"></div>
  <div class="profile-content">
    <div class="profile-avatar-wrap">
      <div class="profile-avatar" id="pfAvatar" onclick="document.getElementById('avatarInput').click()" title="Cambiar foto"></div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="subirAvatar(event)">
      <div class="rank-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#3D1208"><path d="M6 3h12l4 6-10 13L2 9z"/></svg>
      </div>
    </div>
    <h1 class="profile-name serif" id="pfNombre">...</h1>
    <div style="font-size:12.5px;color:rgba(255,245,240,0.5);margin-bottom:10px" id="pfEmail"></div>
    <div class="profile-level" id="pfNivel">💎 NIVEL 1 · INICIANDO</div>
    <div class="level-bar">
      <div class="level-fill" id="pfLevelFill" style="width:0%"></div>
    </div>
    <p class="level-progress-text" id="pfProgreso"></p>
    <button class="btn-editar-perfil" onclick="abrirEditar()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      Editar perfil
    </button>
  </div>
</section>

<!-- Stats -->
<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-num gold" id="stInsignias">0</div>
    <div class="stat-label">INSIGNIAS</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="stCursos">0</div>
    <div class="stat-label">CURSOS</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="stPosts">0</div>
    <div class="stat-label">POSTS</div>
  </div>
  <div class="stat-card">
    <div class="stat-num rose" id="stDiamantes">0</div>
    <div class="stat-label">💎 DIAMANTES</div>
  </div>
</div>

<!-- Insignias -->
<section class="insignias-section">
  <div class="insignias-header">
    <h2 class="insignias-title serif">Mis insignias</h2>
    <div class="insignia-filters" id="insigniaFiltros">
      <span class="chip chip-active" id="filTodas">Todas · 0</span>
      <span class="chip chip-quiet" id="filConseguidas">Conseguidas · 0</span>
      <span class="chip chip-quiet" id="filPendientes">Pendientes · 0</span>

  <div class="insignias-grid" id="insigniasGrid"></div>
</section>

<div class="edit-backdrop" id="editBackdrop">
  <div class="edit-modal">
    <h3 class="serif">Editar perfil</h3>
    <div class="edit-field">
      <label class="edit-label">NOMBRE</label>

    <div class="edit-field">
      <label class="edit-label">SOBRE VOS (opcional)</label>
      <input class="edit-input" id="editBio" placeholder="Emprendedora · Asunción">

<script src="supabase-config.js"></script>
<script src="header-dinamico.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// PERFIL - datos reales desde Supabase
// ═══════════════════════════════════════════════════════════════════
let usuarioActual = null;
let perfilActual = null;

const CATALOGO_INSIGNIAS = [
  { id:'bienvenida', emoji:'👋', hex:'hex-silver', nombre:'Bienvenida',      desc:'Te uniste a CMM',            rareza:'COMÚN',      clase:'rarity-common' },
  { id:'primer_post', emoji:'✏️', hex:'hex-silver', nombre:'Primer post',    desc:'Posteaste en la comunidad',  rareza:'COMÚN',      clase:'rarity-common' },
  { id:'primer_curso', emoji:'🎓', hex:'hex-silver', nombre:'Primer curso',  desc:'Comprate tu primer curso',   rareza:'COMÚN',      clase:'rarity-common' },
  { id:'conversadora', emoji:'💬', hex:'hex-silver', nombre:'Conversadora',  desc:'10 comentarios en la comunidad', rareza:'RARA',   clase:'rarity-rare' },
  { id:'constancia', emoji:'🔥', hex:'hex-silver', nombre:'Constancia',      desc:'10 publicaciones tuyas',     rareza:'RARA',       clase:'rarity-rare' },
  { id:'top_voz', emoji:'⭐', hex:'hex-gold', nombre:'Top voz',              desc:'25 me gusta recibidos',      rareza:'ÉPICA',      clase:'rarity-epic' },
  { id:'creadora', emoji:'✨', hex:'hex-gold', nombre:'Creadora',            desc:'25 publicaciones tuyas',     rareza:'ÉPICA',      clase:'rarity-epic' },
  { id:'coleccionista', emoji:'📚', hex:'hex-gold', nombre:'Coleccionista',  desc:'3 cursos comprados',         rareza:'ÉPICA',      clase:'rarity-epic' },
  { id:'mente_cmm', emoji:'💎', hex:'hex-diamond', nombre:'Mente CMM',       desc:'Tenés el curso principal',   rareza:'LEGENDARIA', clase:'rarity-legendary' }
];

const NIVELES = [
  { n:1, nombre:'INICIANDO',  min:0 },
  { n:2, nombre:'EN CAMINO',  min:100 },
  { n:3, nombre:'CRECIENDO',  min:400 },
  { n:4, nombre:'BRILLANTE',  min:1000 },
  { n:5, nombre:'MILLONARIA', min:2500 }
];

function escapeHtml(t){ if(!t) return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function inicial(n){ return (n||'A').trim().charAt(0).toUpperCase(); }
function colorDeNombre(nombre){
  const p=['linear-gradient(135deg,#7A1B2E,#E8B8C4)','linear-gradient(135deg,#4A0F1E,#B8294A)','linear-gradient(135deg,#D4A356,#E8B8C4)','linear-gradient(135deg,#7A1B2E,#C97990)','linear-gradient(135deg,#B8294A,#FAC775)'];
  let h=0; const s=nombre||'x';
  for(let i=0;i<s.length;i++) h=(h+s.charCodeAt(i))%p.length;
  return p[h];
}
function mostrarToast(msg, err){
  const t=document.getElementById('toast');
  document.getElementById('toastText').textContent=msg;
  t.classList.toggle('error', !!err);
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

function pintarAvatar(){
  const el = document.getElementById('pfAvatar');
  const nombre = perfilActual.nombre || (perfilActual.email||'A').split('@')[0];
  if(perfilActual.avatar_url){
    el.style.backgroundImage = "url('" + perfilActual.avatar_url + "')";
    el.textContent = '';
  } else {
    el.style.backgroundImage = 'none';
    el.style.background = colorDeNombre(nombre);
    el.textContent = inicial(nombre);
  }
}

async function subirAvatar(event){
  const file = event.target.files[0];
  if(!file) return;
  if(file.size > 5*1024*1024) return mostrarToast('La foto no puede pesar más de 5 MB', true);
  mostrarToast('Subiendo foto...');
  const r = await subirImagen(file, 'posts');
  if(!r.exito) return mostrarToast('Error: ' + r.error, true);
  const { error } = await sb.from('perfiles').update({ avatar_url: r.url }).eq('id', usuarioActual.id);
  if(error) return mostrarToast('Error al guardar: ' + error.message, true);
  perfilActual.avatar_url = r.url;
  pintarAvatar();
  mostrarToast('✓ Foto actualizada');
  event.target.value = '';
}

function abrirEditar(){
  document.getElementById('editNombre').value = perfilActual.nombre || '';
  document.getElementById('editBio').value = perfilActual.bio || '';
  document.getElementById('editBackdrop').classList.add('show');
}
function cerrarEditar(){ document.getElementById('editBackdrop').classList.remove('show'); }

async function guardarPerfil(){
  const nombre = document.getElementById('editNombre').value.trim();
  const bio = document.getElementById('editBio').value.trim();
  if(!nombre) return mostrarToast('Poné tu nombre', true);
  const { error } = await sb.from('perfiles').update({ nombre: nombre, bio: bio || null }).eq('id', usuarioActual.id);
  if(error) return mostrarToast('Error: ' + error.message, true);
  perfilActual.nombre = nombre;
  perfilActual.bio = bio;
  document.getElementById('pfNombre').textContent = nombre;
  pintarAvatar();
  cerrarEditar();
  mostrarToast('✓ Perfil actualizado');
}

function renderInsignias(conseguidas){
  const grid = document.getElementById('insigniasGrid');
  grid.innerHTML = CATALOGO_INSIGNIAS.map(i => {
    const tiene = conseguidas.has(i.id);
    return `
      <div class="insignia ${tiene ? '' : 'locked'}">
        <div class="hexagon ${tiene ? i.hex : 'hex-locked'}">
          ${tiene ? i.emoji : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,245,240,0.4)" stroke-width="1.6" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'}
        </div>
        <div class="insignia-name">${i.nombre}</div>
        <div class="insignia-desc">${i.desc}</div>
        <div class="insignia-rarity ${i.clase}">${i.rareza}</div>
      </div>`;
  }).join('');

  const total = CATALOGO_INSIGNIAS.length;
  document.getElementById('filTodas').textContent = 'Todas · ' + total;
  document.getElementById('filConseguidas').textContent = 'Conseguidas · ' + conseguidas.size;
  document.getElementById('filPendientes').textContent = 'Pendientes · ' + (total - conseguidas.size);
}

function aplicarNivel(diamantes){
  let nivel = NIVELES[0];
  for(const n of NIVELES) if(diamantes >= n.min) nivel = n;
  const siguiente = NIVELES.find(n => n.min > diamantes);

  document.getElementById('pfNivel').textContent = '💎 NIVEL ' + nivel.n + ' · ' + nivel.nombre;

  if(siguiente){
    const rango = siguiente.min - nivel.min;
    const avance = diamantes - nivel.min;
    const pct = Math.min(100, Math.round((avance / rango) * 100));
    document.getElementById('pfLevelFill').style.width = pct + '%';
    document.getElementById('pfProgreso').innerHTML =
      '<strong>' + diamantes.toLocaleString('es-PY') + '</strong> / ' + siguiente.min.toLocaleString('es-PY') +
      ' 💎 hasta NIVEL ' + siguiente.n + ' · ' + siguiente.nombre;
  } else {
    document.getElementById('pfLevelFill').style.width = '100%';
    document.getElementById('pfProgreso').innerHTML = '<strong>' + diamantes.toLocaleString('es-PY') + '</strong> 💎 · Nivel máximo alcanzado 🏆';
  }
}

async function cargarDatos(){
  const uid = usuarioActual.id;

  // Cursos comprados
  const { data: compras } = await sb
    .from('compras')
    .select('curso_id, cursos(slug)')
    .eq('usuario_id', uid)
    .eq('estado', 'pagado');
  const nCursos = (compras || []).length;
  const tieneCMM = (compras || []).some(c => c.cursos?.slug === 'cmm');

  // Posts propios
  const { data: misPosts } = await sb.from('posts').select('id').eq('usuario_id', uid);
  const nPosts = (misPosts || []).length;

  // Comentarios propios
  const { data: misComentarios } = await sb.from('comentarios').select('id').eq('usuario_id', uid);
  const nComentarios = (misComentarios || []).length;

  // Likes recibidos en mis posts
  let nLikesRecibidos = 0;
  if(nPosts > 0){
    const ids = misPosts.map(p => p.id);
    const { data: likes } = await sb.from('likes').select('id').in('post_id', ids);
    nLikesRecibidos = (likes || []).length;
  }

  // Diamantes = puntos de actividad
  const diamantes = nCursos*100 + nPosts*10 + nComentarios*5 + nLikesRecibidos*2;

  // Insignias conseguidas
  const conseguidas = new Set(['bienvenida']);
  if(nPosts >= 1) conseguidas.add('primer_post');
  if(nCursos >= 1) conseguidas.add('primer_curso');
  if(nComentarios >= 10) conseguidas.add('conversadora');
  if(nPosts >= 10) conseguidas.add('constancia');
  if(nLikesRecibidos >= 25) conseguidas.add('top_voz');
  if(nPosts >= 25) conseguidas.add('creadora');
  if(nCursos >= 3) conseguidas.add('coleccionista');
  if(tieneCMM) conseguidas.add('mente_cmm');

  document.getElementById('stInsignias').textContent = conseguidas.size;
  document.getElementById('stCursos').textContent = nCursos;
  document.getElementById('stPosts').textContent = nPosts;
  document.getElementById('stDiamantes').textContent = diamantes.toLocaleString('es-PY');

  renderInsignias(conseguidas);
  aplicarNivel(diamantes);
}

const waitSupaPerfil = setInterval(async () => {
  if(typeof sb === 'undefined' || sb === null) return;
  clearInterval(waitSupaPerfil);

  const { data: { user } } = await sb.auth.getUser();
  if(!user){ window.location.replace('/login'); return; }
  usuarioActual = user;

  const { data: perfil } = await sb
    .from('perfiles')
    .select('id, nombre, email, rol, avatar_url, bio')
    .eq('id', user.id)
    .maybeSingle();

  perfilActual = perfil || { id:user.id, email:user.email, nombre:user.email.split('@')[0], rol:'alumna' };

  document.getElementById('pfNombre').textContent = perfilActual.nombre || perfilActual.email.split('@')[0];
  document.getElementById('pfEmail').textContent = perfilActual.email || user.email;
  pintarAvatar();

  document.getElementById('auth-splash-style')?.remove();
  document.getElementById('authSplash')?.remove();

  await cargarDatos();
}, 50);
</script>

<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos · Milena Machado</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1A0A12">

<link rel="stylesheet" href="styles.css">
<style>
  .page-hero{padding:50px 32px 30px;text-align:center;position:relative;overflow:hidden}
  .page-hero-glow-1{position:absolute;width:400px;height:400px;left:-100px;top:-100px;border-radius:50%;background:radial-gradient(circle,rgba(232,184,196,0.25),transparent 65%)}
  .page-hero-glow-2{position:absolute;width:340px;height:340px;right:-80px;top:-60px;border-radius:50%;background:radial-gradient(circle,rgba(212,163,86,0.22),transparent 70%)}
  .page-hero-content{position:relative;max-width:680px;margin:0 auto}
  .page-badge{display:inline-block;padding:6px 14px;background:rgba(212,163,86,0.12);border:0.5px solid rgba(212,163,86,0.4);border-radius:20px;font-size:11.5px;letter-spacing:0.2em;color:#FAC775;font-weight:500;margin-bottom:18px}
  .page-title{font-size:58px;line-height:1.05;font-weight:500;margin:0 0 14px}
  .page-subtitle{font-size:17px;color:rgba(255,245,240,0.75);line-height:1.5;max-width:520px;margin:0 auto}

  section.courses-section{max-width:1280px;padding:30px 32px;margin:0 auto}
  .section-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-bottom:36px}
  .courses-section h2{font-size:28px;font-weight:500;margin:0 0 22px}

  /* CARD MÁS GRANDE Y CHAMATIVO */
  .poster-card{aspect-ratio:3/4;cursor:pointer;position:relative}
  .poster-card-inner{
    padding:28px 22px;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    height:100%;box-sizing:border-box;
    position:relative;text-align:center;
  }

  /* Degradado para destacar texto */
  .text-shadow-overlay{
    position:absolute;inset:0;
    background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(14,5,9,0.55) 0%,rgba(14,5,9,0.7) 70%,rgba(14,5,9,0.4) 100%);
    pointer-events:none;
  }

  /* Comprado */
  .check-icon{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:rgba(93,202,165,0.2);backdrop-filter:blur(10px);border:0.5px solid rgba(93,202,165,0.5);display:flex;align-items:center;justify-content:center;z-index:10}
  .progress-track{width:100%;height:5px;background:rgba(255,245,240,0.15);border-radius:3px;overflow:hidden;margin-top:16px}
  .progress-fill{height:100%;background:linear-gradient(90deg,#FAC775,#D4A356);border-radius:3px}

  /* Bloqueado */
  .lock-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,5,9,0.4) 0%,rgba(14,5,9,0.65) 100%);backdrop-filter:blur(1px);pointer-events:none}
  .price-badge{position:absolute;top:14px;right:14px;padding:7px 12px;background:rgba(212,163,86,0.18);backdrop-filter:blur(12px);border:0.5px solid rgba(212,163,86,0.55);border-radius:9px;font-size:12px;color:#FAC775;font-weight:600;letter-spacing:0.04em;display:flex;align-items:center;gap:6px;z-index:10}
  .unlock-btn{margin-top:18px;padding:11px 24px;background:linear-gradient(135deg,#FAC775,#D4A356);color:#3D1208;font-size:12px;font-weight:600;border-radius:24px;text-align:center;letter-spacing:0.14em;transition:all 0.25s;display:inline-block;border:none;font-family:inherit;cursor:pointer}
  .unlock-btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 20px rgba(212,163,86,0.4)}

  /* Texto del card */
  .poster-cat{position:relative;font-size:11px;letter-spacing:0.22em;color:rgba(255,245,240,0.85);font-weight:600;margin-bottom:14px;text-align:center}
  .poster-cat.gold{color:#FAC775}
  .poster-cat.live{color:#FF8090}
  .poster-cat.exclusive{color:#E8B8C4}
  .poster-cat.green{color:#9FE1CB}
  .poster-title{position:relative;font-family:Georgia,serif;font-style:italic;font-size:24px;line-height:1.15;font-weight:500;letter-spacing:-0.015em;text-align:center;margin-bottom:12px}
  .poster-meta{position:relative;font-size:13px;color:rgba(255,245,240,0.7);text-align:center;display:flex;align-items:center;justify-content:center;gap:7px}
  .meta-dot{width:5px;height:5px;border-radius:50%;display:inline-block}
  .progress-text{position:relative;font-size:11.5px;color:rgba(255,245,240,0.65);margin-top:8px;text-align:center;letter-spacing:0.04em}

  /* Plan upsell */
  .plan-card{margin-top:42px;padding:28px 32px;background:rgba(212,163,86,0.06);border:0.5px solid rgba(212,163,86,0.25);border-radius:18px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .plan-icon{width:60px;height:60px;border-radius:50%;background:rgba(212,163,86,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .plan-content{flex:1;min-width:280px}
  .plan-title{font-size:20px;color:#FAC775;margin-bottom:6px;font-style:italic;font-family:Georgia,serif;font-weight:500}
  .plan-desc{font-size:15px;color:rgba(255,245,240,0.78);line-height:1.5}
  .plan-cta{padding:14px 28px;font-size:13px;font-weight:500;border-radius:12px;letter-spacing:0.12em;flex-shrink:0}

  @media (max-width:900px){
    .page-hero{padding:30px 16px 20px}
    .page-title{font-size:38px}
    .page-subtitle{font-size:14px}
    section.courses-section{padding:20px 16px}
    .section-row{grid-template-columns:repeat(2,1fr);gap:12px}
    .poster-title{font-size:18px}
    .poster-cat{font-size:9px}
    .poster-meta{font-size:11px}
    .courses-section h2{font-size:22px}
    .plan-card{padding:22px;flex-direction:column;text-align:center}
  }
  @media (max-width:520px){
    .section-row{grid-template-columns:1fr;gap:14px}
    .poster-title{font-size:24px}
  }

  /* MOBILE OPTIMIZADO */
  @media (max-width: 768px) {
    .header-inner {
      padding: 14px 20px !important;
    }
    nav.main-nav {
      display: none !important;
    }
    
    section.courses-section {
      padding: 30px 16px !important;
    }
    .section-row {
      grid-template-columns: 1fr 1fr !important;
      gap: 13px !important;
    }
    .poster-card .poster-title {
      font-size: 14px !important;
    }
    .poster-card .poster-shadow {
      aspect-ratio: 3/4 !important;
    }
  }
  
  @media (max-width: 480px) {
    .section-row {
      grid-template-columns: 1fr !important;
    }
  }




  .poster-shadow.limpio{background-size:cover;background-position:center;border-radius:14px;overflow:hidden}
  .precio-chip{position:absolute;bottom:10px;left:10px;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:8px;background:rgba(14,5,9,0.82);backdrop-filter:blur(10px);border:0.5px solid rgba(212,163,86,0.45);color:#FAC775;font-size:11px;font-weight:600;z-index:3}
  .listo-chip{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:rgba(14,5,9,0.75);backdrop-filter:blur(10px);border:0.5px solid rgba(93,202,165,0.5);display:flex;align-items:center;justify-content:center;z-index:3}


  .muestra-chip{position:absolute;bottom:10px;right:10px;display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:8px;background:rgba(93,202,165,0.2);backdrop-filter:blur(10px);border:0.5px solid rgba(93,202,165,0.5);color:#9FE1CB;font-size:10px;font-weight:600;z-index:3;white-space:nowrap}

</style>
</head>
<body>

<header class="main-header">
  <div class="header-inner">
    <a href="/index" class="logo">
      <div class="logo-box">M</div>
      <div class="logo-text">MILENA<br>MACHADO</div>
    </a>
    <a href="/index" class="nav-btn">INICIO</a>
    <a href="/cursos" class="nav-btn active">CURSOS</a>
    <a href="/blog" class="nav-btn">BLOG</a>
    <a href="/comunidad" class="nav-btn">COMUNIDAD</a>
    <div style="margin-left:auto"><a href="/login" class="btn-outline">ENTRAR</a></div>
  </div>
</header>

<section class="page-hero">
  <div class="page-hero-glow-1"></div>
  <div class="page-hero-glow-2"></div>
  <div class="page-hero-content">
    <span class="page-badge">CATÁLOGO COMPLETO</span>
    <h1 class="page-title serif">Todos los <span class="serif-it gradtext" style="font-size:58px">cursos</span></h1>
    <p class="page-subtitle">Elegí dónde empezar. Cada curso está diseñado para resultados concretos en tu negocio.</p>
  </div>
</section>

<section class="courses-section">
  <h2 class="serif">Marketing Digital</h2>
  <div class="section-row" id="cursosDinamicos">
    <!-- Las cards se cargan acá desde Supabase -->
    <div style="grid-column:1/-1;padding:40px;text-align:center;color:rgba(255,245,240,0.4);font-size:13px">
      Cargando cursos...
    </div>
  </div>

  <h2 class="serif" style="margin-top:32px" id="tituloAcompana">Acompañá más</h2>
  <div class="section-row" id="cursosAcompana"></div>
</section>

<footer class="main-footer">
  Hecho con <span class="heart">♥</span> por Milena Machado · Paraguay 2026
</footer>

<script src="supabase-config.js"></script>
<script src="header-dinamico.js"></script>
<script>
(function(){

  const ICONO_TIPO = {
    curso: '🎓', club: '📚', canal: '📺', material: '📄', comunidad: '💬'
  };

  function esc(t){
    if(!t) return '';
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
  }

  function partirTitulo(t){
    if(!t) return '';
    const p = t.split(' ');
    if(p.length > 1 && t.length > 18){
      const m = Math.ceil(p.length / 2);
      return esc(p.slice(0, m).join(' ')) + '<br>' + esc(p.slice(m).join(' '));
    }
    return esc(t);
  }

  function crearCard(curso, user, comprasIds){
    const tieneCompra = comprasIds.includes(curso.id);
    const acceso = curso.acceso || (curso.precio_gs ? 'pago' : 'gratis');
    const esGratis = acceso === 'gratis';
    const esSuscripcion = acceso === 'suscripcion';
    const esExterno = !!curso.enlace_externo;

    // Aunque sea gratis, hasta que no se anote va con candado
    const bloqueado = !esExterno && !tieneCompra;

    // ¿Tiene clases que puede ver sin anotarse?
    const nMuestra = (window.clasesMuestra || {})[curso.id] || 0;

    const gradient = curso.color_gradient || 'linear-gradient(160deg,#2D0A18 0%,#4A0F1E 45%,#1A0509 100%)';
    const fondo = curso.foto_portada
      ? `background-image:url('${esc(curso.foto_portada)}');background-size:cover;background-position:center`
      : `background:${gradient}`;

    const cat = esc(curso.categoria || (curso.tipo === 'club' ? 'CLUB' : 'CURSO'));

    let meta = '';
    if(curso.tipo === 'curso' && curso.modulos_count > 0){
      meta = curso.modulos_count + ' mód · ' + Math.max(1, Math.floor((curso.duracion_minutos || 0) / 60)) + ' h';
    } else if(curso.descripcion){
      meta = esc(curso.descripcion.slice(0, 40));
    } else {
      meta = ICONO_TIPO[curso.tipo] || '🎓';
    }

    const precioTxt = esGratis ? 'GRATIS'
      : esSuscripcion ? 'INCLUIDO'
      : 'Gs ' + (curso.precio_gs || 0).toLocaleString('es-PY');

    const dotColor = esGratis ? '#5DCAA5' : (esSuscripcion ? '#E8B8C4' : '#D4A356');

    // A dónde lleva
    let link;
    if(esExterno) link = curso.enlace_externo;
    else if(!user && bloqueado) link = '/login?curso=' + esc(curso.slug);
    else link = '/curso-detalle?id=' + esc(curso.slug);

    const target = esExterno ? ' target="_blank" rel="noopener"' : '';

    const lockHTML = bloqueado ? `
      <div class="lock-overlay"></div>
      <div class="price-badge">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FAC775" stroke-width="2.5" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        ${precioTxt}
      </div>` : '';

    const checkHTML = (!bloqueado && tieneCompra) ? `
      <div class="check-icon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12" stroke="#5DCAA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>` : '';

    const etiquetaHTML = curso.etiqueta ? `
      <div class="price-badge" style="left:9px;right:auto;background:rgba(184,41,74,0.35);border-color:rgba(232,184,196,0.5);color:#E8B8C4">
        ${esc(curso.etiqueta)}
      </div>` : '';

    let textoBoton = '';
    if(esExterno) textoBoton = 'VER';
    else if(bloqueado) textoBoton = !user ? 'INICIÁ SESIÓN' : (esGratis ? 'ANOTARME GRATIS' : 'DESBLOQUEAR');

    const btnHTML = textoBoton ? `<button class="unlock-btn">${textoBoton}</button>` : '';

    // Con foto de portada: solo la imagen, el diseño ya trae el título
    if(curso.foto_portada){
      return `
      <a href="${link}"${target} class="poster-hover poster-card" data-curso="${esc(curso.slug)}">
        <div class="poster-shadow limpio" style="background-image:url('${esc(curso.foto_portada)}')">
          ${bloqueado ? `
            <div class="precio-chip">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FAC775" stroke-width="2.6" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              ${precioTxt}
            </div>` : ''}
          ${(bloqueado && nMuestra > 0) ? `
            <div class="muestra-chip">
              ▶ ${nMuestra} clase${nMuestra === 1 ? '' : 's'} gratis
            </div>` : ''}
          ${tieneCompra ? `
            <div class="listo-chip">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#5DCAA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>` : ''}
          ${etiquetaHTML}
        </div>
      </a>`;
    }

    return `
      <a href="${link}"${target} class="poster-hover poster-card" data-curso="${esc(curso.slug)}">
        <div class="poster-shadow" style="${fondo}">
          <div style="position:absolute;width:160px;height:160px;left:-30px;top:-20px;border-radius:50%;filter:blur(2px);background:radial-gradient(circle,rgba(184,41,74,0.55),transparent 70%)"></div>
          <div style="position:absolute;width:140px;height:140px;right:-30px;bottom:-30px;border-radius:50%;filter:blur(2px);background:radial-gradient(circle,rgba(232,184,196,0.35),transparent 70%)"></div>
          <div class="text-shadow-overlay"></div>
          ${lockHTML}
          ${checkHTML}
          ${etiquetaHTML}
          <div class="poster-card-inner">
            <div class="poster-cat">${cat}</div>
            <div class="poster-title">${partirTitulo(curso.titulo)}</div>
            <div class="poster-meta">
              <span class="meta-dot" style="background:${dotColor}"></span>
              ${meta}
            </div>
            ${btnHTML}
          </div>
        </div>
      </a>
    `;
  }

  function pintarSeccion(idCont, idTitulo, lista, user, comprasIds, mensajeVacio){
    const cont = document.getElementById(idCont);
    const titulo = idTitulo ? document.getElementById(idTitulo) : null;
    if(!cont) return;

    if(!lista || lista.length === 0){
      cont.innerHTML = '';
      cont.style.display = 'none';
      if(titulo) titulo.style.display = 'none';
      return;
    }

    cont.style.display = '';
    if(titulo) titulo.style.display = '';
    cont.innerHTML = lista.map(c => crearCard(c, user, comprasIds)).join('');
  }

  const checkAuth = setInterval(async () => {
    if(typeof sb === 'undefined' || sb === null) return;
    clearInterval(checkAuth);

    const { data: { user } } = await sb.auth.getUser();

    const { data: cursos, error } = await sb
      .from('cursos')
      .select('*')
      .eq('publicado', true)
      .order('orden', { ascending: true });

    if(error){
      document.getElementById('cursosDinamicos').innerHTML =
        '<div style="grid-column:1/-1;padding:40px;text-align:center;color:#FF8090">No pudimos cargar los cursos</div>';
      return;
    }

    let comprasIds = [];
    if(user){
      const { data: compras } = await sb.from('compras')
        .select('curso_id').eq('usuario_id', user.id).eq('estado', 'pagado');
      comprasIds = (compras || []).map(c => c.curso_id);
    }

    // Cuántas clases de muestra tiene cada curso
    const { data: muestras } = await sb.from('clases')
      .select('curso_id').eq('gratis', true).eq('publicado', true);
    window.clasesMuestra = {};
    (muestras || []).forEach(m => {
      window.clasesMuestra[m.curso_id] = (window.clasesMuestra[m.curso_id] || 0) + 1;
    });

    const todos = cursos || [];
    const principales = todos.filter(c => (c.seccion || 'principal') === 'principal');
    const acompana = todos.filter(c => c.seccion === 'acompana');

    // Fila principal
    const contP = document.getElementById('cursosDinamicos');
    if(principales.length === 0){
      contP.innerHTML = '<div style="grid-column:1/-1;padding:50px 20px;text-align:center;color:rgba(255,245,240,0.5)">' +
        '<div style="font-size:42px;opacity:0.35;margin-bottom:12px">🎓</div>' +
        '<div style="font-size:14px;margin-bottom:6px">Todavía no hay cursos publicados</div>' +
        '<div style="font-size:12px;color:rgba(255,245,240,0.4)">Muy pronto vas a encontrar acá el contenido</div></div>';
    } else {
      contP.innerHTML = principales.map(c => crearCard(c, user, comprasIds)).join('');
    }

    // Fila "Acompañá más"
    pintarSeccion('cursosAcompana', 'tituloAcompana', acompana, user, comprasIds);
  }, 50);
})();
</script>
</body>
</html>
